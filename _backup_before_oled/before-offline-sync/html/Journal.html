
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Journal · Geek⁴u</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <style>
    :root{ --bg:#000000; --surface:#0a0a0c; --surface-2:#121216; --line:#23202b; --text:#f5f3fa; --muted:#9c96aa; --violet:var(--oled-accent); }
    body{ color:var(--text); }
    .jr-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; }
    .jr-search{ position:relative; width:100%; max-width:340px; }
    .jr-search svg{ position:absolute; left:11px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--muted); pointer-events:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; }
    .jr-search .xn-input{ padding-left:34px; }
    .Drugs{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:8px; margin-top:20px; }
    .drug-item{ position:relative; }
    .drug-item .drug-like{ position:absolute; top:50%; right:8px; transform:translateY(-50%); }
    .Drug{ display:grid; grid-template-columns:56px minmax(0,1fr) 44px; align-items:center; gap:14px; min-height:76px; padding:10px 10px 10px 10px; border:1px solid var(--line); border-radius:2px; background:var(--surface-2); color:var(--text); text-decoration:none; transition:border-color .15s ease, background-color .15s ease; }
    @media (hover:hover){ .Drug:hover{ border-color:var(--violet); background:#16161b; } }
    .Drug:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
    .drug-thumb{ display:flex; align-items:center; justify-content:center; width:56px; height:56px; overflow:hidden; border:1px solid var(--line); border-radius:2px; background:#000; color:var(--violet); font-size:20px; font-weight:600; }
    /* Wiki structure drawings are black on white/clear; inverting them suits the black theme. */
    .drug-thumb img{ width:100%; height:100%; object-fit:contain; padding:4px; filter:invert(1) hue-rotate(180deg); }
    .drug-text{ display:flex; flex-direction:column; gap:3px; min-width:0; }
    .drugname{ margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
    .drugclass{ margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--muted); }
    .jr-status{ grid-column:1 / -1; margin:0; padding:40px 12px; text-align:center; font-size:12px; color:var(--muted); }
    .jr-classes{ display:flex; gap:6px; margin-top:16px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
    .jr-classes[hidden]{ display:none; }
    .jr-chip{ flex:none; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:18px; background:transparent; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; white-space:nowrap; transition:color .15s ease, border-color .15s ease, background-color .15s ease; -webkit-tap-highlight-color:transparent; }
    .jr-chip .sc-icon{ width:14px; height:14px; margin:0; }
    .jr-chip small{ font-size:10px; opacity:.75; font-variant-numeric:tabular-nums; }
    .jr-chip[aria-pressed="true"]{ border-color:var(--oled-accent); background:var(--oled-accent-soft); color:var(--text); }
    @media (hover:hover){ .jr-chip:hover{ color:var(--text); border-color:var(--oled-line-strong); } }
    .jr-chip:focus-visible{ outline:2px solid var(--oled-accent); outline-offset:1px; }
    .jr-count{ margin:12px 0 0; font-size:12px; color:var(--muted); }
    .jr-count:empty{ display:none; }
    .bottombar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:20px; }
    @media (max-width:640px){ .jr-search{ max-width:none; } .bottombar .xn-btn{ flex:1; } }

  <script>
            const PAGE = 10;
            let currentOffset = 0;
            let currentSearchQuery = "";
            let currentClass = "";
            let catalog = null; // every substance, once loaded; null = use the API page by page

            async function getSubstances(offset, query = "") {
                let gql;
                if (query) {
                    gql = `{
                      substances(query: "${query}") {
                        name
                        class{
                            chemical
                        }
                        images{thumb}
                      }
                    }`;
                } else {
                    gql = `{
                      substances(limit: 10 offset: ${offset}) {
                        name
                        class{
                            chemical
                        }
                        images{
                            thumb
                        }
                      }
                    }`;
                }
                return fetchGraphQL(gql);
            }

            // The class filter needs the whole catalog, so it's fetched once
            // (a few big pages) and kept for this browser tab.
            const CATALOG_KEY = "xn_pw_catalog_v1";
            async function loadCatalog() {
                try {
                    const saved = JSON.parse(sessionStorage.getItem(CATALOG_KEY) || "null");
                    if (saved && saved.length) return saved;
                } catch (_) {}
                const all = [];
                for (let offset = 0; offset < 4000; offset += 250) {
                    const result = await fetchGraphQL(`{
                      substances(limit: 250 offset: ${offset}) {
                        name
                        commonNames
                        class{ chemical psychoactive }
                        images{ thumb }
                      }
                    }`);
                    const page = result?.data?.substances;
                    if (!Array.isArray(page)) throw new Error("catalog page failed");
                    all.push(...page);
                    if (page.length < 250) break;
                }
                if (!all.length) throw new Error("empty catalog");
                try { sessionStorage.setItem(CATALOG_KEY, JSON.stringify(all)); } catch (_) {}
                return all;
            }

            // "Stimulants" and "stimulant" are the same class.
            const classKey = (name) => String(name || "").trim().toLowerCase().replace(/s$/, "");
            const classesOf = (substance) => [].concat(substance?.class?.psychoactive || []).filter(Boolean);

            function buildChips() {
                const counts = new Map();
                catalog.forEach((substance) => {
                    new Set(classesOf(substance).map(classKey)).forEach((key) => {
                        const label = classesOf(substance).find((c) => classKey(c) === key).trim();
                        const entry = counts.get(key) || { key, count: 0, labels: new Map() };
                        entry.count++;
                        entry.labels.set(label, (entry.labels.get(label) || 0) + 1);
                        counts.set(key, entry);
                    });
                });
                const list = [...counts.values()].sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
                const box = document.getElementById("classChips");
                box.innerHTML = "";
                const chip = (key, label, count) => {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "jr-chip";
                    b.dataset.class = key;
                    b.setAttribute("aria-pressed", String(key === currentClass));
                    const iconKey = window.xnClass.keyForClass(key);
                    if (iconKey) b.append(window.xnClass.icon(iconKey, "jr-chip-icon"));
                    b.append(label);
                    if (count != null) {
                        const small = document.createElement("small");
                        small.textContent = count;
                        b.append(small);
                    }
                    b.addEventListener("click", () => {
                        currentClass = key;
                        box.querySelectorAll(".jr-chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
                        displaySubstances(0, currentSearchQuery);
                    });
                    return b;
                };
                box.append(chip("", "All", catalog.length));
                list.forEach((entry) => {
                    const label = [...entry.labels.entries()].sort((a, b) => b[1] - a[1])[0][0];
                    box.append(chip(entry.key, label.charAt(0).toUpperCase() + label.slice(1), entry.count));
                });
                box.hidden = list.length === 0;
            }

            function filtered(query) {
                const q = query.toLowerCase();
                return catalog.filter((substance) => {
                    if (currentClass && !classesOf(substance).some((c) => classKey(c) === currentClass)) return false;
                    if (!q) return true;
                    return (substance.name || "").toLowerCase().includes(q) ||
                        [].concat(substance.commonNames || []).some((n) => String(n).toLowerCase().includes(q));
                }).sort((a, b) => {
                    if (!q) return 0;
                    // Names starting with the search come first.
                    const sa = (a.name || "").toLowerCase().startsWith(q) ? 0 : 1;
                    const sb = (b.name || "").toLowerCase().startsWith(q) ? 0 : 1;
                    return sa - sb;
                });
            }

            let displaySeq = 0;

            async function displaySubstances(offset, query = "") {
                const seq = ++displaySeq;
                const drugsDiv = document.querySelector(".Drugs");
                try {
                    let substances, more;
                    const likesLoad = window.xnLikes.load();
                    if (catalog) {
                        const matches = filtered(query);
                        if (offset >= matches.length) offset = Math.max(0, Math.floor((matches.length - 1) / PAGE) * PAGE);
                        substances = matches.slice(offset, offset + PAGE);
                        more = offset + PAGE < matches.length;
                        const pages = Math.max(1, Math.ceil(matches.length / PAGE));
                        const chip = document.querySelector(`.jr-chip[data-class="${CSS.escape(currentClass)}"]`);
                        const what = currentClass && chip ? [...chip.childNodes].find((n) => n.nodeType === 3)?.textContent || "" : "";
                        document.getElementById("classCount").textContent = (currentClass || query)
                            ? `${matches.length} ${matches.length === 1 ? "substance" : "substances"}${what ? " in " + what : ""}${query ? ` matching “${query}”` : ""} · page ${Math.floor(offset / PAGE) + 1} of ${pages}`
                            : "";
                    } else {
                        const result = await getSubstances(offset, query);
                        substances = result?.data?.substances || [];
                        more = !query && substances.length >= PAGE;
                    }
                    const liked = await likesLoad;
                    if (seq !== displaySeq) return; // a newer search is on its way

                    drugsDiv.innerHTML = "";

                    substances.forEach(substance => {
                        const drugDiv = document.createElement("a");
                        const imgUrl = substance?.images?.[0]?.thumb || '';

                        const DrugName = substance?.name ?? "";
                        const DrugClass = [].concat(substance?.class?.chemical || []).join(", ");
                        const Psycho = classesOf(substance).join(", ");

                        drugDiv.className = "Drug";
                        drugDiv.href = "/journal/Drug?drug=" + encodeURIComponent(DrugName);
                        drugDiv.dataset.drugname = DrugName;
                        drugDiv.dataset.drugclass = DrugClass;
                        drugDiv.dataset.drugimage = imgUrl;
                        drugDiv.innerHTML = `
                            <span class="drug-thumb"></span>
                            <span class="drug-text"><span class="drugname"></span><span class="drugclass"></span></span>
                        `;
                        drugDiv.querySelector(".drugname").append(window.xnClass.icon(window.xnClass.keyFor(substance)), DrugName);
                        drugDiv.querySelector(".drugclass").textContent = [Psycho, DrugClass].filter(Boolean).join(" · ") || "Substance";
                        const thumb = drugDiv.querySelector(".drug-thumb");
                        if (imgUrl) {
                            const img = document.createElement("img");
                            img.src = imgUrl;
                            img.alt = "";
                            img.loading = "lazy";
                            img.onerror = () => { thumb.textContent = DrugName.charAt(0).toUpperCase(); };
                            thumb.appendChild(img);
                        } else {
                            thumb.textContent = DrugName.charAt(0).toUpperCase();
                        }
                        // The heart sits beside the link (not inside it) so tapping it doesn't open the page.
                        const item = document.createElement("div");
                        item.className = "drug-item";
                        const like = document.createElement("button");
                        like.type = "button";
                        like.className = "xn-like drug-like";
                        window.xnLikes.bind(like, { name: DrugName, image: imgUrl, class: DrugClass }, liked.has(window.xnLikes.key(DrugName)));
                        item.append(drugDiv, like);
                        drugsDiv.appendChild(item);
                    });
                    if (!substances.length) {
                        drugsDiv.innerHTML = `<p class="jr-status"></p>`;
                        drugsDiv.firstChild.textContent = query ? `Nothing matches “${query}”${currentClass ? " in this class" : ""}.` : currentClass ? "No substances in this class." : "No substances on this page.";
                    }
                    currentOffset = offset;
                    currentSearchQuery = query;
                    document.getElementById("backBtn").disabled = offset === 0 || (!catalog && !!query);
                    document.getElementById("nextBtn").disabled = !more;
                } catch (error) {
                    console.error("Error fetching substances:", error);
                    if (seq !== displaySeq) return;
                    drugsDiv.innerHTML = `<p class="jr-status">Couldn't reach PsychonautWiki. Check your connection and try again.</p>`;
                }
            }

            function nextPage() {
                displaySubstances(currentOffset + PAGE, currentSearchQuery);
            }

            function previousPage() {
                if (currentOffset >= PAGE) {
                    displaySubstances(currentOffset - PAGE, currentSearchQuery);
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                displaySubstances(0);
                loadCatalog().then((all) => {
                    catalog = all;
                    buildChips();
                    displaySubstances(currentSearchQuery ? 0 : currentOffset, currentSearchQuery);
                }).catch((error) => console.warn("Class filter unavailable:", error));

                const inputField = document.getElementById("input");
                let searchTimeout;
                
                inputField.addEventListener("input", (e) => {
                    clearTimeout(searchTimeout);
                    const value = e.target.value.trim();
                    
                    if (value.length === 0) {
                        searchTimeout = setTimeout(() => {
                            displaySubstances(0);
                        }, 300);
                    } else if (value.length >= (catalog ? 1 : 2)) {
                        searchTimeout = setTimeout(() => {
                            displaySubstances(0, value);
                        }, catalog ? 120 : 300);
                    }
                });
            });
            </script>
            </div>
        
            <script>

        let timeout;
        document.querySelector("#input").addEventListener("input", (e) => {
            const value = e.target.value.trim();

            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            clearTimeout(timeout);

            timeout = setTimeout(() => {
                searchSuggestions();
            }, 500);
        });

        function searchSuggestions() {
			value = document.querySelector("#input").value
            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            const gql = `
            {
                substances(query: "${value}") {
                    name
                    class
                }
            }`;

            fetchGraphQL(gql).then(res => {
                document.getElementById("sug").style.visibility = "visible";

                showSuggestions(res.data.substances);
            });
        }

        function showSuggestions(substances) {
            const datalist = document.getElementById("sugC");
            datalist.innerHTML = ""; 

            substances.forEach(sub => {
                const option = document.createElement("p");
                option.textContent = sub.name;
                option.id = "sug1";
                datalist.appendChild(option);
                
                option.addEventListener("click", (e) => {
                    const value = option.textContent;
                    document.getElementById("input").value = value;
                    search();
                });
            });

			let index = -1
			children = datalist.children
			document.getElementById("input").addEventListener("keydown", (e) => {
				for (let i=0;i<children.length;i++) {
					if (children[i].classList.contains("Selected")) {
						children[i].classList.remove("Selected")
					}
				}

                if (event.key == "ArrowDown") {
					index += 1
					if (index > children.length - 1) {
						index = 0
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "ArrowUp") {
					index -= 1
					if (index < 0) {
						index = children.length - 1
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "Enter") {
                    document.getElementById("input").value = children[index].textContent;
                    search();
				}
			})
        }



         function fetchGraphQL(query) {
            const url = "https://api.psychonautwiki.org";
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            }).then(r => r.json());
        }

        async function getData(substanceName) {
            const query = `
            {
                substances(query: "${substanceName}") {
                    name
                    images{thumb}
                    summary
                    addictionPotential
                    uncertainInteractions{name}
				    unsafeInteractions{name}
				    dangerousInteractions{name}

                    roas {
                        name
                        duration {
                            onset { min max units }
                            comeup { min max units }
                            peak { min max units }
                            offset { min max units }
                        }
                        dose {
                                units
                                common {
                                    min
                                }
                        }
                    }
                }
            }`;
            return fetchGraphQL(query);
        }

        var units = ""

		let onset = 0
		let comeup = 0
		let peak = 0
		let offset = 0

        async function search() {
            const substanceName = document.getElementById("input").value.trim();
            

            if (!substanceName) return;

            document.getElementById("sug").style.visibility = "collapse";

        
            status.textContent = "Loading...";
            const result = await getData(substanceName);
            console.log("RAW RESPONSE:", result);

            const substance = result?.data?.substances?.[0];
            if (!substance) {
                status.textContent = "No data found.";
                return;
            }

            const duration = substance.roas?.[0]?.duration;
            const dosage = substance.roas?.[0]?.dose;
            units = dosage.units
            
            if (!duration) {
                status.textContent = "No duration data.";
                return;
            }

            const commonDose = dosage?.common?.min;
            if (!commonDose) {
                status.textContent = "No common dose data found for this substance.";
                return;
            }

            currentSubstance = substance;
            currentCommonDose = commonDose;
            addedDoses = [];

            onset = DurationsIntoHour(duration.onset)
            comeup = DurationsIntoHour(duration.comeup)
            peak = DurationsIntoHour(duration.peak)
            offset = DurationsIntoHour(duration.offset)


        }
