<main class="xn-page di">
  <section class="xn-card di-head">

  <div class="di-info" id="diInfo" hidden></div>

  <h2 class="xn-label di-section" id="diRoutesTitle" hidden>Dosing by route</h2>
  <div class="DrugInfoIntakeMethods" aria-live="polite"></div>
  <p class="di-note">Dose and duration data come from PsychonautWiki and are a rough guide, not advice.</p>
</main>

<script>
  const DOSE_LEVELS = [["threshold", "Threshold"], ["light", "Light"], ["common", "Common"], ["strong", "Strong"], ["heavy", "Heavy"]];
  const DURATION_PARTS = [["onset", "Onset"], ["comeup", "Come up"], ["peak", "Peak"], ["offset", "Offset"], ["afterglow", "After effects"], ["duration", "Duration"], ["total", "Total"]];

  // Everything beyond dosing. Asked for separately so that, if PsychonautWiki
  // ever rejects one of these fields, the page still loads with dosing only.
  const DETAILS = `
        commonNames
        systematicName
        addictionPotential
        toxicity
        crossTolerances
        tolerance { full half zero }
        effects { name url }
        dangerousInteractions { name }
        unsafeInteractions { name }
        uncertainInteractions { name }`;

  async function getDrugInfo(drugName) {
    try {
      const info = await askWiki(drugName, DETAILS);
      if (!info.errors) return info;
    } catch (_) {}
    return askWiki(drugName, "");
  }

  async function askWiki(drugName, DETAIL_FIELDS) {
    const url = "https://api.psychonautwiki.org";

    const query = `
    {
      substances(query: ${JSON.stringify(drugName)}) {
        name
        summary
        class { chemical psychoactive }
        images { thumb }
${DETAIL_FIELDS}
        roas {
          name

          dose {
            units
            threshold
            heavy
            common { min max }
            light { min max }
            strong { min max }
          }

          duration {
            afterglow { min max units }
            comeup { min max units }
            duration { min max units }
            offset { min max units }
            onset { min max units }
            peak { min max units }
            total { min max units }
          }

          bioavailability {
            min max
          }
        }
      }
    }`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });
    if (!res.ok) throw new Error("PsychonautWiki answered " + res.status);
    return res.json();
  }

  function range(min, max) {
    const has = (v) => v !== null && v !== undefined;
    if (has(min) && has(max)) return min === max ? String(min) : `${min}–${max}`;
    if (has(min)) return `${min}+`;
    if (has(max)) return `up to ${max}`;
    return "";
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function rows(list, entries) {
    entries.forEach(([label, value]) => {
      const row = el("div", "di-row");
      row.append(el("dt", "", label), el("dd", "", value));
      list.append(row);
    });
  }

  function doseEntries(dose) {
    if (!dose) return [];
    const units = dose.units ? " " + dose.units : "";
    const out = [];
    DOSE_LEVELS.forEach(([key, label]) => {
      const v = dose[key];
      if (v === null || v === undefined) return;
      let text = typeof v === "object" ? range(v.min, v.max) : String(v);
      if (key === "heavy" && typeof v !== "object") text += "+";
      if (text) out.push([label, text + units]);
    });
    return out;
  }

  function durationEntries(duration) {
    if (!duration) return [];
    const out = [];
    DURATION_PARTS.forEach(([key, label]) => {
      const v = duration[key];
      if (!v) return;
      const text = range(v.min, v.max);
      if (text) out.push([label, `${text} ${v.units || ""}`.trim()]);
    });
    return out;
  }

  function card(title) {
    const box = el("section", "xn-card di-info-card");
    box.append(el("h2", "xn-h2 di-info-title", title));
    return box;
  }

  function chips(names, className, link) {
    const wrap = el("div", "di-chips");
    names.forEach((item) => {
      const name = typeof item === "string" ? item : item?.name;
      if (!name) return;
      const url = link && item?.url;
      const chip = el(url ? "a" : "span", "di-chip " + (className || ""), name);
      if (url) {
        chip.href = url;
        chip.target = "_blank";
        chip.rel = "noopener noreferrer";
      }
      wrap.append(chip);
    });
    return wrap;
  }

  const cap = (text) => String(text).charAt(0).toUpperCase() + String(text).slice(1);

  function renderDetails(s) {
    const box = document.getElementById("diInfo");
    box.innerHTML = "";

    // At a glance
    const facts = [];
    const names = [].concat(s.commonNames || []).filter((n) => n && n.toLowerCase() !== s.name.toLowerCase());
    if (names.length) facts.push(["Also known as", names.join(", ")]);
    if (s.systematicName) facts.push(["Systematic name", s.systematicName]);
    if (s.class?.psychoactive?.length) facts.push(["Psychoactive class", s.class.psychoactive.join(", ")]);
    if (s.class?.chemical?.length) facts.push(["Chemical class", s.class.chemical.join(", ")]);
    if (s.addictionPotential) facts.push(["Addiction potential", cap(s.addictionPotential)]);
    [].concat(s.toxicity || []).filter(Boolean).forEach((t, i) => facts.push([i ? "" : "Toxicity", cap(t)]));
    if (facts.length) {
      const c = card("At a glance");
      const list = el("dl", "di-facts");
      facts.forEach(([label, value]) => {
        const row = el("div", "di-fact");
        row.append(el("dt", "", label), el("dd", "", value));
        list.append(row);
      });
      c.append(list);
      box.append(c);
    }

    // Tolerance
    const tol = s.tolerance || {};
    const tolRows = [["Full tolerance", tol.full], ["Half tolerance", tol.half], ["Back to baseline", tol.zero]].filter(([, v]) => v);
    const cross = [].concat(s.crossTolerances || []).filter(Boolean);
    if (tolRows.length || cross.length) {
      const c = card("Tolerance");
      if (tolRows.length) {
        const list = el("dl", "di-list");
        rows(list, tolRows.map(([k, v]) => [k, cap(v)]));
        c.append(list);
      }
      if (cross.length) {
        c.append(el("h3", "xn-label di-sub", "Cross-tolerance with"));
        c.append(chips(cross.map(cap)));
      }
      box.append(c);
    }

    // Interactions, worst first
    const groups = [
      ["Dangerous", s.dangerousInteractions, "is-danger", "Don't combine."],
      ["Unsafe", s.unsafeInteractions, "is-unsafe", "Avoid, or take extra care."],
      ["Caution", s.uncertainInteractions, "is-caution", "Effects may be unpredictable."],
    ].filter(([, list]) => list && list.length);
    if (groups.length) {
      const c = card("Interactions");
      groups.forEach(([title, list, cls, hint]) => {
        const head = el("h3", "xn-label di-sub di-int-head " + cls, title);
        head.append(el("span", "di-int-hint", hint));
        c.append(head, chips(list, cls));
      });
      box.append(c);
    }

    // Effects
    const effects = [].concat(s.effects || []).filter((e) => e?.name);
    if (effects.length) {
      const c = card("Effects");
      c.append(el("p", "di-card-note", `${effects.length} listed on PsychonautWiki. Tap one to read about it.`));
      c.append(chips(effects, "di-effect", true));
      box.append(c);
    }

    box.hidden = !box.children.length;
  }

  function showMessage(text) {
    const box = document.querySelector(".DrugInfoIntakeMethods");
    box.innerHTML = "";
    box.append(el("p", "xn-card di-empty", text));
  }

  function render(substance) {
    const name = substance.name;
    document.title = name + " · Geek⁴u";
    document.querySelector(".DrugInfoName").textContent = name;
    const iconKey = window.xnClass?.keyFor(substance) || "";
    const icon = document.getElementById("diIcon");
    icon.dataset.class = iconKey;
    icon.title = window.xnClass?.LABELS[iconKey] || "";
    icon.hidden = !iconKey;
    renderDetails(substance);

    const classes = [].concat(substance.class?.chemical || [], substance.class?.psychoactive || []);
    if (classes.length) document.getElementById("diClass").textContent = classes.join(" · ");

    if (substance.summary) {
      const summary = document.getElementById("diSummary");
      summary.textContent = substance.summary;
      summary.hidden = false;
    }

    const thumbUrl = substance.images?.[0]?.thumb;
    if (thumbUrl) {
      const thumb = document.getElementById("diThumb");
      const img = el("img");
      img.src = thumbUrl;
      img.alt = "";
      img.onerror = () => { thumb.hidden = true; };
      thumb.append(img);
      thumb.hidden = false;
    }

    document.getElementById("diWiki").href = "https://psychonautwiki.org/wiki/" + encodeURIComponent(name.replace(/\s+/g, "_"));
    document.getElementById("diTripsit").href = "https://drugs.tripsit.me/" + encodeURIComponent(name.toLowerCase().replace(/\s+/g, "-"));
    document.getElementById("diLinks").hidden = false;

    const sub = { name, image: thumbUrl || "", class: classes.join(", ") };
    window.xnLikes.load().then((liked) => {
      window.xnLikes.bind(document.getElementById("diLike"), sub, liked.has(window.xnLikes.key(name)));
    });

    const DrugInfoIntakeMethods = document.querySelector(".DrugInfoIntakeMethods");
    DrugInfoIntakeMethods.innerHTML = "";
    const roas = substance.roas || [];
    document.getElementById("diRoutesTitle").hidden = !roas.length;
    if (!roas.length) return showMessage("PsychonautWiki has no dose or duration data for this substance.");

    roas.forEach((roa) => {
      const card = el("section", "xn-card DrugInfoIntakeMethod");
      const head = el("div", "di-roa-head");
      head.append(el("h2", "xn-h2 di-roa-name", roa.name || "Unknown route"));
      const bio = roa.bioavailability ? range(roa.bioavailability.min, roa.bioavailability.max) : "";
      head.append(el("span", "di-bio", "Bioavailability: " + (bio ? bio + "%" : "N/A")));
      card.append(head);

      const doses = doseEntries(roa.dose);
      const durations = durationEntries(roa.duration);
      if (doses.length) {
        card.append(el("h3", "xn-label di-sub", "Dose"));
        const list = el("dl", "di-list di-doses");
        rows(list, doses);
        card.append(list);
      }
      if (durations.length) {
        card.append(el("h3", "xn-label di-sub", "Duration"));
        const list = el("dl", "di-list");
        rows(list, durations);
        card.append(list);
      }
      if (!doses.length && !durations.length) card.append(el("p", "xn-empty", "No dose or duration data for this route."));
      DrugInfoIntakeMethods.append(card);
    });
  }

  const drugName = new URLSearchParams(window.location.search).get("drug");
  if (!drugName) {
    document.querySelector(".DrugInfoName").textContent = "No substance picked";
    showMessage("Pick a substance from the Journal to see its details.");
  } else {
    getDrugInfo(drugName).then((info) => {
      const substance = info?.data?.substances?.[0];
      if (!substance) {
        document.querySelector(".DrugInfoName").textContent = drugName;
        return showMessage("PsychonautWiki doesn't have this substance.");
      }
      render(substance);
    }).catch((error) => {
      console.error(error);
      document.querySelector(".DrugInfoName").textContent = drugName;
      showMessage("Couldn't reach PsychonautWiki. Check your connection and try again.");
    });
  }
</script>
