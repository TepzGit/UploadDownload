<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Notes · Geek⁴u</title>
  <meta name="description" content="Your dose notes by substance, trip reports and a notepad.">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geek⁴u" />
  <link rel="stylesheet" href="/oled.css" />
  <script src="/nav.js"></script>
  <script src="/media.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/notes.css" />
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>

<main class="xn-page nt">

  <div class="nt-seg" role="tablist" aria-label="Notes">
    <button type="button" role="tab" class="nt-seg-btn" id="tabDoses" aria-controls="paneDoses" data-tab="doses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3L14 9V3M7.5 14h9"/></svg>By substance</button>
    <button type="button" role="tab" class="nt-seg-btn" id="tabReports" aria-controls="paneReports" data-tab="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6M9 10.5h4"/></svg>Trip reports</button>
    <button type="button" role="tab" class="nt-seg-btn" id="tabPad" aria-controls="panePad" data-tab="pad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>Notepad</button>
    <button type="button" role="tab" class="nt-seg-btn" id="tabPublic" aria-controls="panePublic" data-tab="public"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Public</button>
  </div>

  <section class="nt-pane" id="paneDoses" role="tabpanel" aria-labelledby="tabDoses">
    <div class="nt-doses">
      <aside class="nt-index" aria-label="Substances">
        <div class="nt-bar">
          <label class="nt-find"><span class="xn-sr">Find a substance or word</span><input class="xn-input" id="doseFind" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="nt-index-head"><span class="xn-label">Substances</span><span class="nt-count" id="doseCount"></span></div>
        <nav class="nt-index-list" id="doseIndex" aria-label="Jump to a substance"></nav>
      </aside>
      <div class="nt-groups" id="doseGroups" aria-live="polite"><p class="nt-empty">Loading…</p></div>
    </div>
  </section>

  <section class="nt-pane" id="paneReports" role="tabpanel" aria-labelledby="tabReports" hidden>
    <div class="nt-bar">
      <label class="nt-find"><span class="xn-sr">Find a report</span><input class="xn-input" id="repFind" type="search" placeholder="Find a report…" autocomplete="off" spellcheck="false"></label>
      <button type="button" class="xn-btn xn-btn-primary" id="repNew"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New report</button>
    </div>
    <div class="nt-reports" id="repList" aria-live="polite"><p class="nt-empty">Loading…</p></div>
  </section>

  <section class="nt-pane" id="panePublic" role="tabpanel" aria-labelledby="tabPublic" hidden>
    <!-- Public (mommy 2026-11-02): a wall of shared trip reports and welcomes
         for new accounts, with a people search on the side. -->
    <div class="nt-pubwall">
      <div class="nt-wall-col">
        <div class="nt-bar">
          <label class="nt-find"><span class="xn-sr">Find on the wall</span><input class="xn-input" id="pubFind" type="search" placeholder="Find a substance, word or person…" autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="nt-wall" id="pubList" aria-live="polite"><p class="nt-empty">Loading…</p></div>
        <button type="button" class="xn-btn nt-more" id="pubMore" hidden>Show older posts</button>
      </div>
      <aside class="nt-people" aria-labelledby="peopleTitle">
        <h2 class="xn-label" id="peopleTitle">Find people</h2>
        <label class="nt-find"><span class="xn-sr">Find people by name</span><input class="xn-input" id="peopleFind" type="search" placeholder="Search for a user…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <ul class="nt-people-list" id="peopleList" aria-live="polite"></ul>
        <h2 class="xn-label nt-people-new">New members</h2>
        <ul class="nt-people-list" id="newList"></ul>
      </aside>
    </div>
  </section>

  <section class="nt-pane" id="panePad" role="tabpanel" aria-labelledby="tabPad" hidden>
    <div class="nt-pad" id="pad">
      <aside class="nt-pad-side">
        <div class="nt-bar">
          <label class="nt-find"><span class="xn-sr">Find a note</span><input class="xn-input" id="padFind" type="search" placeholder="Find a note…" autocomplete="off" spellcheck="false"></label>
          <button type="button" class="xn-btn xn-btn-primary nt-icon-btn" id="padNew" aria-label="New note" title="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <ul class="nt-pad-list" id="padList" aria-label="Notes"></ul>
      </aside>
      <div class="nt-pad-main xn-card" id="padEditor">
        <div class="nt-pad-head">
          <button type="button" class="nt-back" id="padBack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Notes</button>
          <span class="nt-saved" id="padSaved" aria-live="polite"></span>
          <button type="button" class="nt-tool" id="padPin" aria-pressed="false" title="Pin to the top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg></button>
          <button type="button" class="nt-tool" id="padMono" aria-pressed="false" title="Typewriter font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg></button>
          <button type="button" class="nt-tool nt-del" id="padDelete" title="Delete note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </div>
        <input class="nt-pad-title" id="padTitle" type="text" placeholder="Title" maxlength="120" aria-label="Title">
        <textarea class="nt-pad-text" id="padText" placeholder="Write anything…" aria-label="Note" spellcheck="true"></textarea>
        <p class="nt-pad-foot" id="padFoot"></p>
      </div>
    </div>
  </section>
</main>

<dialog class="nt-dlg nt-read-dlg" id="readDlg" aria-labelledby="readTitle">
  <div class="nt-read">
    <article class="nt-dlg-card xn-card nt-read-main">
      <div class="nt-dlg-head">
        <a class="nt-author" id="readAuthor" href="#"></a>
        <span class="nt-mine" id="readMine" hidden></span>
        <span class="nt-spacer"></span>
        <button type="button" class="xn-btn nt-read-edit" id="readEdit" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>Edit</button>
        <button type="button" class="nt-x" id="readClose" aria-label="Close">×</button>
      </div>
      <span class="nt-report-day" id="readDay"></span>
      <h2 class="xn-h2 nt-pub-title" id="readTitle"></h2>
      <span class="nt-report-stars" id="readStars"></span>
      <dl class="nt-pub-facts" id="readFacts"></dl>
      <div class="nt-gallery" id="readPics" hidden></div>
      <p class="nt-pub-body" id="readBody"></p>
      <div class="nt-read-foot">
        <button type="button" class="nt-like" id="readLike" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3c-.3 0-.6-.1-.8-.3C6.9 16.4 3 13.2 3 8.9 3 6.2 5.1 4 7.7 4c1.7 0 3.3.9 4.3 2.3C13 4.9 14.6 4 16.3 4 18.9 4 21 6.2 21 8.9c0 4.3-3.9 7.5-8.2 11.1-.2.2-.5.3-.8.3z"/></svg><span class="nt-like-label">Like</span><span class="nt-like-count"></span></button>
        <span class="nt-likers" id="readLikers"></span>
      </div>
    </article>
    <aside class="nt-dlg-card xn-card nt-talk" aria-labelledby="talkTitle">
      <div class="nt-talk-head">
        <h2 class="xn-h2" id="talkTitle">Comments</h2>
        <span class="nt-count" id="talkCount"></span>
      </div>
      <p class="nt-talk-note" id="talkNote" hidden></p>
      <ol class="nt-talk-list" id="talkList" aria-live="polite"></ol>
      <form class="nt-talk-form" id="talkForm">
        <textarea class="xn-input nt-talk-text" id="talkText" rows="1" maxlength="1000" placeholder="Write a comment…" aria-label="Write a comment"></textarea>
        <button type="submit" class="xn-btn xn-btn-primary" id="talkSend" disabled>Send</button>
      </form>
    </aside>
  </div>
</dialog>

<dialog class="nt-dlg" id="repDlg" aria-labelledby="repDlgTitle">
  <form class="nt-dlg-card xn-card" id="repForm">
    <div class="nt-dlg-head">
      <h2 class="xn-h2" id="repDlgTitle">Trip report</h2>
      <button type="button" class="nt-x" id="repClose" aria-label="Close">×</button>
    </div>
    <label class="nt-field"><span class="xn-label">Title</span><input class="xn-input" name="title" maxlength="120" placeholder="e.g. Beach day, first time"></label>
    <div class="nt-row">
      <label class="nt-field"><span class="xn-label">Day</span><input class="xn-input" name="day" type="date" required></label>
      <label class="nt-field"><span class="xn-label">Graph session</span><select class="xn-input" name="experience"><option value="0">None</option></select></label>
    </div>
    <label class="nt-field"><span class="xn-label">Substances and doses</span><input class="xn-input" name="substances" maxlength="300" placeholder="Filled in from the session, or type them"></label>
    <label class="nt-field"><span class="xn-label">Set and setting</span><input class="xn-input" name="setting" maxlength="300" placeholder="Where, who with, how you felt going in"></label>
    <div class="nt-field"><span class="xn-label" id="rateLabel">How was it?</span>
      <div class="nt-stars" role="radiogroup" aria-labelledby="rateLabel" id="repStars"></div>
    </div>
    <label class="nt-field"><span class="xn-label">Report</span><textarea class="xn-input nt-body-input" name="body" rows="12" placeholder="The come-up, the peak, the come-down, what you learned…"></textarea></label>
    <div class="nt-field"><span class="xn-label" id="repPicsLabel">Pictures <span class="nt-pics-count" id="repPicsCount"></span></span>
      <div class="nt-pics-edit" id="repPics" role="group" aria-labelledby="repPicsLabel"></div>
      <input type="file" class="nt-file" id="repFiles" accept="image/jpeg,image/png,image/gif,image/webp,image/*" multiple tabindex="-1" aria-hidden="true">
    </div>
    <label class="nt-public"><input type="checkbox" name="public"><span><strong>Public</strong><small>Anyone with an account can read it under Public reports, with your name on it. Your Graph session stays private.</small></span></label>
    <p class="nt-error" id="repError" hidden></p>
    <div class="nt-actions">
      <button type="button" class="xn-btn xn-btn-danger" id="repDelete">Delete</button>
      <span class="nt-spacer"></span>
      <button type="button" class="xn-btn" id="repCancel">Cancel</button>
      <button type="submit" class="xn-btn xn-btn-primary" id="repSave">Save</button>
    </div>
  </form>
</dialog>

<script type="module" src="/notes.js"></script>
</body>
</html>
