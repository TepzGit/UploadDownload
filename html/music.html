<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Music · Geek⁴u</title>
  <link rel="stylesheet" href="/music.css">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geek⁴u" />
  <link rel="stylesheet" href="/oled.css" />
  <script src="/nav.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>

<main class="xn-page mu" id="mu">
  <aside class="mu-side" aria-label="Playlists">
    <div class="mu-side-actions">
      <button type="button" class="xn-btn" id="muNew"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
      <button type="button" class="xn-btn" id="muImport"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Import</button>
      <button type="button" class="xn-btn mu-viz-open" data-viz><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v4M8 10v8M12 5v13M16 9v9M20 12v6"/></svg>Visualizer</button>
    </div>
    <nav class="mu-lists" id="muLists" aria-label="Playlists"></nav>
    <p class="mu-device" id="muDevice" hidden></p>
  </aside>

  <section class="mu-view" id="muView" aria-live="polite">
    <p class="mu-status">Loading…</p>
  </section>
</main>

<!-- The player: a bar at the bottom; on phones, tapping it opens Now playing. -->
<div class="mu-player" id="muPlayer" hidden>
  <button type="button" class="mu-np-open" id="muOpenNow" aria-label="Open Now playing">
    <span class="mu-art mu-art-sm" id="muArt"></span>
    <span class="mu-now-text"><strong id="muTitle"></strong><span id="muArtist"></span></span>
  </button>
  <div class="mu-controls">
    <button type="button" class="mu-ctl mu-ctl-opt" id="muShuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3.5c2.5 0 4 1.5 5.5 4l1 1.8c1.5 2.7 3 4.2 5.5 4.2H21M3 18h3.5c1.5 0 2.7-.6 3.7-1.7M13.8 7.7C15 6.6 16.3 6 18.5 6H21M18 3l3 3-3 3M18 13l3 3-3 3"/></svg></button>
    <button type="button" class="mu-ctl" id="muPrev" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 5.8v12.4c0 .8-.9 1.3-1.6.8L9 12.8a1 1 0 0 1 0-1.6l8.4-6.2c.7-.5 1.6 0 1.6.8z" class="mu-fill"/></svg></button>
    <button type="button" class="mu-ctl mu-play" id="muPlay" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mu-fill mu-i-play" d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l9.6-6.4a1 1 0 0 0 0-1.6L9.6 4.8C8.9 4.3 8 4.8 8 5.6z"/><path class="mu-fill mu-i-pause" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <button type="button" class="mu-ctl mu-viz-bar" data-viz aria-label="Visualizer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v4M8 10v8M12 5v13M16 9v9M20 12v6"/></svg></button>
    <button type="button" class="mu-ctl" id="muNext" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 5.8v12.4c0 .8.9 1.3 1.6.8l8.4-6.2a1 1 0 0 0 0-1.6L6.6 5c-.7-.5-1.6 0-1.6.8z" class="mu-fill"/></svg></button>
    <button type="button" class="mu-ctl mu-ctl-opt" id="muRepeat" aria-label="Repeat" data-mode="off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg><b class="mu-one">1</b></button>
  </div>
  <div class="mu-seek">
    <span id="muTime">0:00</span>
    <input type="range" id="muSeekBar" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="muLength">0:00</span>
  </div>
  <div class="mu-vol">
    <button type="button" class="mu-ctl mu-ctl-opt mu-viz-btn" id="muVizBtn" aria-label="Visualizer" title="Visualizer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v4M8 10v8M12 5v13M16 9v9M20 12v6"/></svg></button>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="mu-fill" d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>
    <input type="range" id="muVolume" min="0" max="100" value="100" aria-label="Volume">
  </div>
</div>

<!-- Now playing, full screen on phones -->
<div class="mu-now" id="muNow" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
  <div class="mu-now-top">
    <button type="button" class="mu-ctl" id="muCloseNow" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="mu-now-from" id="muNowFrom"></span>
    <button type="button" class="mu-ctl" id="muNowViz" aria-label="Visualizer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v4M8 10v8M12 5v13M16 9v9M20 12v6"/></svg></button>
  </div>
  <span class="mu-art mu-art-xl" id="muNowArt"></span>
  <div class="mu-now-text mu-now-big"><strong id="muNowTitle"></strong><span id="muNowArtist"></span></div>
  <div class="mu-now-slot" id="muNowSlot"></div>
</div>

<!-- Dialogs -->
<div class="mu-modal" id="muModal" role="dialog" aria-modal="true" aria-labelledby="muModalTitle" hidden>
  <form class="mu-modal-card xn-card" id="muModalForm" novalidate>
    <div class="mu-modal-head">
      <h2 class="xn-h2" id="muModalTitle"></h2>
      <button type="button" class="mu-x" data-close aria-label="Close">×</button>
    </div>
    <div id="muModalBody"></div>
    <p class="mu-error" id="muModalError" role="alert" hidden></p>
    <div class="mu-modal-actions" id="muModalActions"></div>
  </form>
</div>

<audio id="muAudio" preload="metadata" playsinline></audio>
<script type="module" src="/music.js"></script>
<script type="module" src="/musicviz.js"></script>
<script type="module" src="/musicshell.js"></script>
</body>
</html>
