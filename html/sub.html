
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Substance</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/sub.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    </head>
    <body>


           <div id="app">
            <h2 class="title" >Substance Timeline</h2>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input id="input" placeholder="Enter substance (e.g. lsd)" >
                <button class="searchbtn" onclick="search()">Search</button>
            </div>

               <div id="dosePanel" >
                    <input id="doseInput" placeholder="Dose (e.g. 300)">
                    <input id="doseStartHour" type="time" placeholder="Start hour" >
                    <button class="addbtn" onclick="addDose()">Add Dose</button>
                    <button class="resetbtn"  onclick="resetGraph()">Reset</button>
               </div>

            <p id="status" ></p>

            <div id="multiplierInfo">
                <h3 class="titlee">Dose Multipliers</h3>
                <div id="multiplierList" ></div>
            </div>
            <div id="myPlot" ></div>
            <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
            <div id="doses">
            </div>
                <div class="bottombar" >
                    <button class="btn" onclick="downloadChart()">Save Data</button>
                    <a class="btn" href="/journal">Back</a>
                </div>
        </div>

        <script>

        document.querySelector("#input").addEventListener("input", (e) => {
            clearTimeout(timeout);

            const value = e.target.value.trim();

            if (value.length < 2) return; // wait for at least 2 chars

            timeout = setTimeout(() => {
                searchSuggestions(value);
            }, 200);
        });

        function searchSuggestions(value) {
            const gql = `
            {
                substances(query: "${query}") {
                    name
                }
            }`;

            fetchGraphQL(gql).then(res => {
                showSuggestions(res.data.substances);
            });
        }

        let chart;
        let currentSubstance = null;
        let currentCommonDose = null;
        let addedDoses = []; // Array of {dose, startHour, multiplier}


        function fetchGraphQL(query) {
            const url = "https://api.psychonautwiki.org";
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            }).then(r => r.json());
        }

        async function getData(substanceName) {
            const query = `
            {
                substances(query: "${substanceName}") {
                    name

                    roas {
                        duration {
                            onset { min max units }
                            comeup { min max units }
                            peak { min max units }
                            offset { min max units }
                        }
                        dose {
                                units
                                common {
                                    min
                                }
                        }
                    }
                }
            }`;
            return fetchGraphQL(query);
        }

	function DurationsIntoHour(duration) {
        let value;

		if (duration.units == "minutes") {
			value = ((duration.min + duration.max) / 2) / 60
		} else {
			value = ((duration.min + duration.max) / 2)
		}

        return Math.round(value * 2) / 2;
        
	}

    var substanceNameI = ""
    var units = ""

	let onset = 0
	let comeup = 0
	let peak = 0
	let offset = 0

        async function search() {
            const substanceName = document.getElementById("input").value.trim();
            const status = document.getElementById("status");

            if (!substanceName) return;

            status.textContent = "Loading...";
            const result = await getData(substanceName);
            console.log("RAW RESPONSE:", result);

            const substance = result?.data?.substances?.[0];
            if (!substance) {
                status.textContent = "No data found.";
                return;
            }

            const duration = substance.roas?.[0]?.duration;
            const dosage = substance.roas?.[0]?.dose;
            units = dosage.units
            
            if (!duration) {
                status.textContent = "No duration data.";
                return;
            }

            const commonDose = dosage?.common?.min;
            if (!commonDose) {
                status.textContent = "No common dose data found for this substance.";
                return;
            }

            currentSubstance = substance;
            currentCommonDose = commonDose;
            addedDoses = [];

            onset = DurationsIntoHour(duration.onset)
            comeup = DurationsIntoHour(duration.comeup)
            peak = DurationsIntoHour(duration.peak)
            offset = DurationsIntoHour(duration.offset)

            status.textContent = `Loaded: ${substance.name} (common dose: ${commonDose})`;
            document.getElementById("dosePanel").style.display = "flex";
            document.getElementById("multiplierInfo").style.display = "none";
            
            if (chart) chart.destroy();
        }

	function DurationsIntoPoints(steps = 10) {
		doseStartHour = document.querySelector("#doseStartHour").value

		let currentX = 0
		if (doseStartHour != "") {
			currentX = parseFloat(doseStartHour)
		} else {
			let now = new Date()
			currentX = now.getHours() + now.getMinutes() / 60
		}

        intensityMultiplier = document.querySelector("#doseInput").value / currentCommonDose

        xPoints = []
        yPoints = []
        
        incrementalNum = 0.05

		for (i=incrementalNum;i<=onset + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push(0)
		}
		currentX += onset

		for (i=incrementalNum;i<=comeup + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push((i/comeup)*100*intensityMultiplier)

		}
		currentX += comeup
        
		for (i=incrementalNum;i<=peak + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push(100*intensityMultiplier)
		}
		currentX += peak

		for (i=incrementalNum;i<=offset + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push((1-(i/offset))*100*intensityMultiplier)
		}

        xPoints.push(Number(currentX+offset).toFixed(2))
        yPoints.push(0);

		return {xPoints: xPoints, yPoints: yPoints}
	}

	function addDose() {
		let {xPoints, yPoints} = DurationsIntoPoints()
        addedDoses.push({
			x: xPoints,
			y: yPoints,
		})

        dosesDiv = document.getElementById("doses")
        newDoseDiv = document.createElement("div")
        newDoseDiv.id = "dose"
        newDoseDiv.innerHTML = `
        <p id="drugname" class="drugT">${currentSubstance.name}</p>
        <p id="drugdose" class="drugT">${document.querySelector("#doseInput").value} ${units}</p>
        <p id="consTime" class="drugT">${formatTime(document.querySelector("#doseStartHour").value)}</p>
        <input type="hidden" class="doseNumber" value='${dosesDiv.querySelectorAll(".dose").length+1}'>
        <div id="delete" onclick="DeleteDose(this)"> 
        <p class="closebtn">Delete</p> 
        </div>
        `
        dosesDiv.appendChild(newDoseDiv)

		if (chart) {
			Plotly.purge('myPlot');
		}
		drawChart()
	}

    function DeleteDose(button) {
        doses = button.parentElement.parentElement.querySelectorAll("#dose")

        indexValue = button.parentElement.querySelector(".doseNumber").value;
        addedDoses.splice(indexValue-1, 1);
        button.parentElement.remove();
        
        if (doses.length == 1) {
            Plotly.purge('myPlot');;
            return
        }

        if (chart) {
			Plotly.purge('myPlot');;
		}
		drawChart()
    }

    function formatTime(value) {
        if (value.includes(":")) {
            return value;
        }

        let hours = Math.floor(value);
        let minutes = Math.round((value - hours) * 60);

        // fix rounding overflow (e.g. 1.999 → 2:00)
        if (minutes === 60) {
            hours += 1;
            minutes = 0;
        }

        return `${hours}:${minutes.toString().padStart(2, "0")}`;
}
	
    
	// Points format [{x:0, y: 0}, {x:1, y:1}]
	function drawChart() {
        var allX = [];
        addedDoses.forEach(dose => 
        {
            dose.x.forEach(x => {
                if (!allX.includes(x)) {
                    allX.push(x);
                }
            })
        }
        );

        // Step 3: Compute combined Y-values
        var combinedY = [];
        allX.forEach(x => {
            yTotal = 0;
            addedDoses.forEach(dose => {
                if (dose.x.includes(x)) {
                    yTotal += dose.y[dose.x.indexOf(x)];
                }
            });
            combinedY.push(yTotal);
        });

        let minX = Math.floor(Math.min(...allX));
        let maxX = Math.ceil(Math.max(...allX));
        let tickVals = [];
        for (let h = minX; h <= maxX; h++) {
            tickVals.push(h);
        }

        let tickText = tickVals.map(x => {
            let wrapped = x % 24;
            let hour = Math.floor(wrapped);
            let min = Math.round((wrapped - hour) * 60);
            return hour.toString().padStart(2,'0') + ':' + min.toString().padStart(2,'0');
        });

        // Step 4: Plot
        var trace = {
            x: allX,
            y: combinedY,
            mode: 'lines+markers',
            type: 'scatter',
            name: 'Combined Y-values',
        
            line: {
                
                color: 'rgb(107, 51, 150)',
                width: 3,
                dash: 'solid'
            },
             marker: {
                size: 1,
                color: 'rgb(139, 71, 192)',
                opacity: 0.5,
                symbol: 'circle' // square, diamond, cross, etc.
               
            },
            fill: 'tozeroy', // key for filling graph
            fillcolor: 'rgb(139, 71, 192)', // fill color with transparency
            
        };
        var layout = {
            
            yaxis: { title: 'Intensity' },
            xaxis: {
                title: 'Time',
                tickmode: 'array',
                tickvals: tickVals,
                ticktext: tickText
            },
            
            font: {
                family: 'nerd',
                size: 12,
                color: '#fff'
            },

            paper_bgcolor: '#0a0a0a',
            plot_bgcolor: '#0a0a0a',
             
        };

        Plotly.newPlot('myPlot', [trace], layout, {modeBarButtonsToRemove: ['zoom2d', 'hoverClosestGl2d', 'hoverClosestPie', 'toggleSpikelines', 'pan2d', 'select2d', 'lasso2d', 'zoomIn2d', 'zoomOut2d', 'autoScale2d', 'resetScale2d']}), 
        {
            title: 'Combined Graph (Y-values summed)',
        };
	}
    function downloadChart() {
        data = {
            DrugName: substanceNameI,
            Date: "",
            Doses: [],
        }
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0'); // months are 0-indexed
        const day = String(today.getDate()).padStart(2, '0');

        data.Date = `${day}/${month}/${year}`;

        for (let i=0;i<addedDosesX.length;i++) {
            data.Doses.push({x: addedDosesX[i], y: addedDosesY[i]})
        }
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${substanceNameI.replace(/\s+/g, "_")}_${day}-${month}-${year}.json`;
        a.click();
        URL.revokeObjectURL(url);

    }
        </script>

    </body>
</html>
