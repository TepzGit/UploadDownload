    <div id="app">
            <h2 class="title">Substance Timeline</h2>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input id="input" placeholder="Enter substance (e.g. lsd)">
                <button class="searchbtn" onclick="search()">Search</button>
            </div>
            
            <div id="sug" style="visibility: collapse;">
                <div id="sugC">
                 </div>
            </div>



               <div id="dosePanel" style="display: flex;">
                    <input id="doseInput" placeholder="Dose (e.g. 300)">
                    <input id="doseStartHour" type="time" placeholder="Start hour">
                    <button class="addbtn" onclick="addDose()">Add Dose</button>
                    <button class="resetbtn" onclick="resetGraph()">Reset</button>
               </div>

            <p id="status">Loaded: Pregabalin (common dose: 225)</p>

            <div id="multiplierInfo" style="display: none;">
                <h3 class="titlee">Dose Multipliers</h3>
                <div id="multiplierList"></div>
            </div>

        </div>

                    <button class="btn" onclick="saveChart()">Save Data</button>

        <script>

        let timeout;
        document.querySelector("#input").addEventListener("input", (e) => {
            const value = e.target.value.trim();

            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            clearTimeout(timeout);

            timeout = setTimeout(() => {
                searchSuggestions();
            }, 500);
        });

        function searchSuggestions() {
			value = document.querySelector("#input").value
            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            const gql = `
            {
                substances(query: "${value}") {
                    name
                }
            }`;

            fetchGraphQL(gql).then(res => {
                document.getElementById("sug").style.visibility = "visible";
                document.getElementById("dosePanel").style.display = "none";
                document.getElementById("status").textContent = ``;

                showSuggestions(res.data.substances);
            });
        }

        function showSuggestions(substances) {
            const datalist = document.getElementById("sugC");
            datalist.innerHTML = ""; 

            substances.forEach(sub => {
                const option = document.createElement("p");
                option.textContent = sub.name;
                option.id = "sug1";
                datalist.appendChild(option);
                
                option.addEventListener("click", (e) => {
                    const value = option.textContent;
                    document.getElementById("input").value = value;
                    search();
                });
            });

			let index = -1
			children = datalist.children
			document.getElementById("input").addEventListener("keydown", (e) => {
				for (let i=0;i<children.length;i++) {
					if (children[i].classList.contains("Selected")) {
						children[i].classList.remove("Selected")
					}
				}

				if (event.key == "ArrowDown") {
					index += 1
					if (index > children.length - 1) {
						index = 0
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "ArrowUp") {
					index -= 1
					if (index < 0) {
						index = children.length - 1
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "Enter") {
                    document.getElementById("input").value = children[index].textContent;
                    search();
				}
			})
        }


        let chart;
        let currentSubstance = null;
        let currentCommonDose = null;
        let addedDoses = []; 


        function fetchGraphQL(query) {
            const url = "https://api.psychonautwiki.org";
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            }).then(r => r.json());
        }

        async function getData(substanceName) {
            const query = `
            {
                substances(query: "${substanceName}") {
                    name

                    roas {
                        name
                        duration {
                            onset { min max units }
                            comeup { min max units }
                            peak { min max units }
                            offset { min max units }
                        }
                        dose {
                                units
                                common {
                                    min
                                }
                        }
                    }
                }
            }`;
            return fetchGraphQL(query);
        }

	function DurationsIntoHour(duration) {
        let value;

		if (duration.units == "minutes") {
			value = ((duration.min + duration.max) / 2) / 60
		} else {
			value = ((duration.min + duration.max) / 2)
		}

        return Math.round(value * 2) / 2;
        
		}

		var units = ""

		let onset = 0
		let comeup = 0
		let peak = 0
		let offset = 0

        async function search() {
            const substanceName = document.getElementById("input").value.trim();
            const status = document.getElementById("status");

            if (!substanceName) return;

            document.getElementById("sug").style.visibility = "collapse";

            status.textContent = "Loading...";
            const result = await getData(substanceName);
            console.log("RAW RESPONSE:", result);

            const substance = result?.data?.substances?.[0];
            if (!substance) {
                status.textContent = "No data found.";
                return;
            }

            const duration = substance.roas?.[0]?.duration;
            const dosage = substance.roas?.[0]?.dose;
            units = dosage.units
            
            if (!duration) {
                status.textContent = "No duration data.";
                return;
            }

            const commonDose = dosage?.common?.min;
            if (!commonDose) {
                status.textContent = "No common dose data found for this substance.";
                return;
            }

            currentSubstance = substance;
            currentCommonDose = commonDose;
            addedDoses = [];

            onset = DurationsIntoHour(duration.onset)
            comeup = DurationsIntoHour(duration.comeup)
            peak = DurationsIntoHour(duration.peak)
            offset = DurationsIntoHour(duration.offset)

            status.textContent = `Loaded: ${substance.name} (common dose: ${commonDose})`;
            document.getElementById("dosePanel").style.display = "flex";
            document.getElementById("multiplierInfo").style.display = "none";
            
            if (chart) chart.destroy();
        }

	function DurationsIntoPoints(steps = 10) {
		doseStartHour = document.querySelector("#doseStartHour").value

		let currentX = 0
		if (doseStartHour != "") {
			currentX = parseFloat(doseStartHour)
		} else {
			let now = new Date()
			currentX = now.getHours() + now.getMinutes() / 60
		}

        intensityMultiplier = document.querySelector("#doseInput").value / currentCommonDose

        xPoints = []
        yPoints = []
        
        incrementalNum = 0.05

		for (i=incrementalNum;i<=onset + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push(0)
		}
		currentX += onset

		for (i=incrementalNum;i<=comeup + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push((i/comeup)*100*intensityMultiplier)

		}
		currentX += comeup
        
		for (i=incrementalNum;i<=peak + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push(100*intensityMultiplier)
		}
		currentX += peak

		for (i=incrementalNum;i<=offset + 1e-9;i+=incrementalNum) {
            xPoints.push(Number(currentX+i).toFixed(2))
            yPoints.push((1-(i/offset))*100*intensityMultiplier)
		}

        xPoints.push(Number(currentX+offset).toFixed(2))
        yPoints.push(0);

		return {xPoints: xPoints, yPoints: yPoints}
	}

	function addDose() {
		let {xPoints, yPoints} = DurationsIntoPoints()
        addedDoses.push({
			x: xPoints,
			y: yPoints,
		})

        dosesDiv = document.getElementById("doses")
		time = document.querySelector("#doseStartHour").value

		if (time == "") {
			const now = new Date();
			const hours = String(now.getHours()).padStart(2, "0");
			const minutes = String(now.getMinutes()).padStart(2, "0");

			time = `${hours}:${minutes}`;
		} else {
			time = formatTime(time)
		}

        newDoseDiv = document.createElement("div")
        newDoseDiv.id = "dose"
        newDoseDiv.innerHTML = `
        <p id="drugname" class="drugT">${currentSubstance.name}</p>
        <p id="drugMethod" style="display: none" class="drugT">${currentSubstance.roas[0].name}</p>
        <p id="drugdose" class="drugT">${document.querySelector("#doseInput").value} ${units}</p>
        <p id="consTime" class="drugT">${time}</p>
        <input type="hidden" class="doseNumber" value='${dosesDiv.querySelectorAll(".dose").length+1}'>
        <div id="delete" onclick="DeleteDose(this)"> 
        <p class="closebtn">Delete</p> 
        </div>
        `
        dosesDiv.appendChild(newDoseDiv)

		if (chart) {
			Plotly.purge('myPlot');
		}
		drawChart()
	}

    function DeleteDose(button) {
        doses = button.parentElement.parentElement.querySelectorAll("#dose")

        indexValue = button.parentElement.querySelector(".doseNumber").value;
        addedDoses.splice(indexValue-1, 1);
        button.parentElement.remove();
        
        if (doses.length == 1) {
            Plotly.purge('myPlot');;
            return
        }

        if (chart) {
			Plotly.purge('myPlot');;
		}
		drawChart()
    }

    function formatTime(value) {
        if (value.includes(":")) {
            return value;
        }

        let hours = Math.floor(value);
        let minutes = Math.round((value - hours) * 60);

        
        if (minutes === 60) {
            hours += 1;
            minutes = 0;
        }

        return `${hours}:${minutes.toString().padStart(2, "0")}`;
}
	
    
	
	function drawChart() {
        var allX = [];
        addedDoses.forEach(dose => 
        {
            dose.x.forEach(x => {
                if (!allX.includes(x)) {
                    allX.push(x);
               }
            })
        }
        );

		allTimeX = []
		allX.forEach(x => {
			let num = Number(x) % 24;

			let hours = Math.floor(num);
			let minutes = Math.round((num - hours) * 60);

			let finalX = `${hours.toString().padStart(2, "0")}:${minutes.toString().padStart(2, "0")}`;

			allTimeX.push(finalX);
		});

        
        var combinedY = [];
        allX.forEach(x => {
            yTotal = 0;
            addedDoses.forEach(dose => {
                if (dose.x.includes(x)) {
                    yTotal += dose.y[dose.x.indexOf(x)];
                }
            });
            combinedY.push(yTotal);
        });


        let minX = Math.floor(Math.min(...allX));
        let maxX = Math.ceil(Math.max(...allX));
        let tickVals = [];
        for (let h = minX; h <= maxX; h++) {
            tickVals.push(h);
        }

        let tickText = tickVals.map(x => {
            let wrapped = x % 24;
            let hour = Math.floor(wrapped);
            let min = Math.round((wrapped - hour) * 60);
            return hour.toString().padStart(2,'0') + ':' + min.toString().padStart(2,'0');
        });


        
        var trace = {
            x: allX,
            y: combinedY,
            mode: 'lines+markers',
            type: 'scatter',
            name: 'Combined Y-values',

			hovertext: allTimeX,
			hovertemplate: "Time: %{hovertext}<br>Intensity: %{y}<extra></extra>",
        
            line: {
                color: 'rgb(107, 51, 150)',
                width: 5,
                dash: 'solid'
            },
             marker: {
                size: 1,
                color: 'rgb(139, 71, 192)',
                opacity: 0.5,
                symbol: 'circle' 
               
            },
            fill: 'tozeroy', 
            fillcolor: 'rgba(140, 71, 192, 0.47)', 
            
        };
		

        
		var layout = {
			template: "simple_white",
			margin: { t: 30, r: 20, b: 40, l: 40 },
            
            yaxis: {
				title: 'Intensity',
			},

            xaxis: {
                title: 'Time',
                tickmode: 'array',
                tickvals: tickVals,
                ticktext: tickText,
            },
            
            font: {
                family: 'nerd',
                size: 12,
                color: '#fff'
            },

            paper_bgcolor: '#0a0a0a',
            plot_bgcolor: '#0a0a0a',
             
        };

        Plotly.newPlot('myPlot', [trace], layout, {modeBarButtonsToRemove: ['zoom2d', 'hoverClosestGl2d', 'hoverClosestPie', 'toggleSpikelines', 'pan2d', 'select2d', 'lasso2d', 'zoomIn2d', 'zoomOut2d', 'autoScale2d', 'resetScale2d']}), 
        {
            title: 'Combined Graph (Y-values summed)',
        };
	}
    async function saveChart() {
        data = {
            DrugName: currentSubstance.name,
			Unit: units,
            Doses: [],
        }
        
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');

        doses = document.querySelector("#doses").querySelectorAll("#dose")
        for (let i=0;i<doses.length;i++) {
            dose = doses[i]
			hourMin = dose.querySelector("#consTime").textContent
			const DateTaken = new Date(`${year}-${month}-${day}T${hourMin}:00`);

            data.Doses.push({
				Time: DateTaken.toISOString(),
                DoseAmount: dose.querySelector("#drugdose").textContent.trim().split(" ")[0],
                Unit: dose.querySelector("#drugdose").textContent.trim().split(" ")[1],
                Method: dose.querySelector("#drugMethod").textContent.trim()
            })
        }

        const json = JSON.stringify(data, null, 2);

		const res = await fetch("/sub/saveData", {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
			},
			body: json
		})

		if (res.ok) {
			console.log("Succesfully saved data to acc")
			
		}
    }
        </script>
