<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pill Database · Geek⁴u</title>
  <meta name="description" content="Pictures of pills that members have seen, with what they are said to contain.">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geek⁴u" />
  <link rel="stylesheet" href="/oled.css" />
  <script src="/nav.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/pilldb.css" />
  <link rel="stylesheet" href="/classicons.css" />
  <script src="/classicons.js"></script>
  <script src="/media.js"></script>
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>

<main class="xn-page pd" id="pilldb">

  <aside class="pd-warn" role="note">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>
    <p><strong>Reported, not proof.</strong> Fake pills copy real ones. Test a pill before you take it.</p>
  </aside>

  <div class="pd-bar">
  <div class="pd-tabs" role="tablist" aria-label="Which pills">
    <button type="button" class="pd-tab" role="tab" id="tabAll" aria-selected="true" aria-controls="pdGrid" data-view="all">All pills</button>
    <button type="button" class="pd-tab" role="tab" id="tabMine" aria-selected="false" aria-controls="pdGrid" data-view="mine">My pills</button>
    <button type="button" class="pd-tab" role="tab" id="tabCheck" aria-selected="false" aria-controls="pdGrid" data-view="check" hidden>To check <span class="pd-tab-count" id="pendingCount"></span></button>
  </div>
  <div class="pd-cats" id="pdCats" role="group" aria-label="Categories" hidden></div>
  </div>

  <section class="xn-card pd-tools" aria-label="Search and filters">
    <label class="pd-search">
      <span class="xn-label">Search</span>
      <input class="xn-input" id="pdQ" type="search" autocomplete="off" placeholder="Brand, strength, contents or imprint" enterkeyhint="search">
    </label>
    <label><span class="xn-label">Color</span><select class="xn-input" id="pdColor"><option value="">Any</option></select></label>
    <label><span class="xn-label">Shape</span><select class="xn-input" id="pdShape"><option value="">Any</option></select></label>
    <label><span class="xn-label">Form</span><select class="xn-input" id="pdKind"><option value="">Any</option></select></label>
    <label class="pd-status" id="pdStatusBox" hidden><span class="xn-label">Status</span>
      <select class="xn-input" id="pdStatus"><option value="pending">Waiting</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All</option></select>
    </label>
    <label class="pd-check"><input type="checkbox" id="pdLab"> Lab confirmed only</label>
    <button type="button" class="xn-btn xn-btn-primary pd-add" id="pdAdd">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a pill
    </button>
  </section>

  <p class="pd-count" id="pdCount" aria-live="polite"></p>
  <ul class="pd-grid" id="pdGrid" aria-busy="true"></ul>
  <p class="xn-empty pd-empty" id="pdEmpty" hidden></p>
  <button type="button" class="xn-btn pd-more" id="pdMore" hidden>Show more</button>
</main>

<dialog class="pd-dialog" id="pdView" aria-labelledby="pdViewTitle">
  <div class="pd-dlg-card">
    <button type="button" class="pd-x" data-close aria-label="Close">×</button>
    <div class="pd-view" id="pdViewBody"></div>
  </div>
</dialog>

<dialog class="pd-dialog" id="pdEdit" aria-labelledby="pdEditTitle">
  <form class="pd-dlg-card pd-form" id="pdForm" novalidate>
    <button type="button" class="pd-x" data-close aria-label="Close">×</button>
    <h2 class="xn-h2 pd-form-title" id="pdEditTitle">Add a pill</h2>
    <p class="xn-sub">An admin checks every new pill and every change before others can see it.</p>
    <div class="pd-pic-pick">
      <button type="button" class="pd-pic-btn" id="pdPicBtn">
        <img id="pdPicPreview" alt="" hidden>
        <span id="pdPicText">Choose a picture<small>JPG, PNG, GIF or WebP, up to 10 MB</small></span>
      </button>
      <input type="file" id="pdPicFile" accept="image/jpeg,image/png,image/gif,image/webp" class="pd-file" tabindex="-1" aria-hidden="true">
    </div>
    <div class="pd-fields">
      <label><span class="xn-label">Brand or name on the pack *</span><input class="xn-input" name="brand" maxlength="80" required autocomplete="off" placeholder="For example, Elvanse"></label>
      <label><span class="xn-label">Strength</span><input class="xn-input" name="strength" maxlength="40" autocomplete="off" placeholder="70 mg"></label>
      <label class="pd-wide"><span class="xn-label">Said to contain *</span><input class="xn-input" name="contents" maxlength="200" required autocomplete="off" placeholder="Lisdexamfetamine"></label>
      <label><span class="xn-label">Imprint (letters or numbers on it)</span><input class="xn-input" name="imprint" maxlength="60" autocomplete="off" placeholder="S489 70 mg"></label>
      <label><span class="xn-label">Color</span><select class="xn-input" name="color"><option value="">Not sure</option></select></label>
      <label><span class="xn-label">Shape</span><select class="xn-input" name="shape"><option value="">Not sure</option></select></label>
      <label><span class="xn-label">Form</span><select class="xn-input" name="form"><option value="">Not sure</option></select></label>
      <label><span class="xn-label">Country</span><input class="xn-input" name="country" maxlength="60" autocomplete="off"></label>
      <label class="pd-wide"><span class="xn-label">Notes</span><textarea class="xn-input" name="notes" rows="3" maxlength="1000" placeholder="Where it came from, the pack, anything that helps"></textarea></label>
      <fieldset class="pd-wide pd-lab" id="pdLabFields" hidden>
        <legend>Lab confirmed (admins only)</legend>
        <label><span class="xn-label">Contents a lab found</span><input class="xn-input" name="labContents" maxlength="200" autocomplete="off"></label>
        <label><span class="xn-label">Which lab or test</span><input class="xn-input" name="labSource" maxlength="200" autocomplete="off"></label>
      </fieldset>
    </div>
    <p class="pd-form-error" id="pdFormError" role="alert" hidden></p>
    <div class="pd-form-foot">
      <button type="button" class="xn-btn" data-close>Cancel</button>
      <button type="submit" class="xn-btn xn-btn-primary" id="pdSave">Send for checking</button>
    </div>
  </form>
</dialog>

<script type="module" src="/pilldb.js"></script>
</body>
</html>
