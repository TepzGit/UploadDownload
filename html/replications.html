<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Replications · Geek⁴u</title>
  <meta name="description" content="Pictures of what effects look like, backed up from PsychonautWiki.">
  <link rel="stylesheet" href="/replications.css">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geek⁴u" />
  <link rel="stylesheet" href="/oled.css" />
  <script src="/nav.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>

<main class="xn-page rp">
  <header class="rp-intro">
    <p class="rp-meta" id="meta" aria-live="polite"></p>
  </header>
{{if .Admin}}
  <section class="xn-card rp-admin" id="backup" aria-labelledby="bkTitle">
    <div class="rp-admin-row">
      <div class="rp-admin-text">
        <h2 class="xn-h2" id="bkTitle">Backup</h2>
        <p class="rp-admin-note" id="bkNote">Downloads every replication from PsychonautWiki to this computer, with the artist credits. Running it again only fetches new ones.</p>
      </div>
      <div class="rp-admin-actions">
        <button type="button" class="xn-btn xn-btn-primary" id="bkStart">Back up now</button>
        <button type="button" class="xn-btn" id="bkStop" hidden>Stop</button>
      </div>
    </div>
    <div class="rp-progress" id="bkProgress" hidden>
      <div class="rp-bar" role="progressbar" aria-labelledby="bkPhase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bkBar"><span></span></div>
      <p class="rp-phase" id="bkPhase" aria-live="polite"></p>
    </div>
  </section>
{{end}}
  <div class="rp-tools">
    <label class="xn-sr" for="q">Search replications</label>
    <input class="xn-input rp-search" id="q" type="search" placeholder="Search effects, artists, substances…" autocomplete="off" enterkeyhint="search">
    <label class="xn-sr" for="effect">Effect</label>
    <select class="xn-input rp-effect" id="effect"><option value="">All effects</option></select>
  </div>
  <div class="rp-chips" id="kinds" role="group" aria-label="Kind of effect" hidden></div>
  <p class="rp-count" id="count" aria-live="polite"></p>
  <ul class="rp-grid" id="grid" aria-label="Replications"></ul>
  <button type="button" class="xn-btn rp-more" id="more" hidden>Show more</button>
  <p class="rp-empty" id="empty" hidden></p>
</main>

<dialog class="rp-view" id="view" aria-labelledby="vTitle">
  <div class="rp-view-case">
    <div class="rp-view-media" id="vMedia"></div>
    <div class="rp-view-side">
    <div class="rp-view-info">
      <div class="rp-view-head">
        <h2 class="rp-view-title" id="vTitle"></h2>
        <span class="rp-view-count" id="vCount"></span>
      </div>
      <p class="rp-view-caption" id="vCaption"></p>
      <p class="rp-view-about" id="vAbout"></p>
      <dl class="rp-view-facts" id="vFacts"></dl>
    </div>
      <div class="rp-view-bar">
        <div class="rp-view-links">
          <a class="xn-btn" id="vSource" target="_blank" rel="noopener noreferrer">On PsychonautWiki</a>
          <a class="xn-btn" id="vOpen" target="_blank" rel="noopener">Full size</a>
{{if .Admin}}          <button type="button" class="xn-btn xn-btn-danger" id="vRemove">Remove</button>
{{end}}        </div>
        <div class="rp-view-nav">
          <button type="button" class="xn-btn" data-step="-1" aria-label="Previous picture">‹</button>
          <button type="button" class="xn-btn" data-step="1" aria-label="Next picture">›</button>
          <button type="button" class="xn-btn xn-btn-primary" data-close>Close</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<script>
(function () {
  const PAGE = 48;
  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const effectSel = document.getElementById("effect");
  const kindsBox = document.getElementById("kinds");
  const count = document.getElementById("count");
  const meta = document.getElementById("meta");
  const more = document.getElementById("more");
  const empty = document.getElementById("empty");
  const toast = (msg, bad) => window.xnToast && window.xnToast(msg, bad);
  const num = (n) => Number(n).toLocaleString();
  const size = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? Math.round(b / 1e6) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
  const isVideo = (it) => /^video\//.test(it.mime || "");
  const fileUrl = (it) => "/replications/files/" + encodeURIComponent(it.file);
  const thumbUrl = (it) => it.thumb ? "/replications/thumbs/" + encodeURIComponent(it.thumb) : fileUrl(it);
  const effectOf = (it) => (it.effects && it.effects[0]) || "Other";

  let items = [];
  let shown = [];
  let drawn = 0;
  let kind = "";
  let admin = false;

  const params = new URLSearchParams(location.search);
  q.value = params.get("q") || "";
  kind = params.get("kind") || "";

  function remember() {
    const p = new URLSearchParams();
    if (q.value.trim()) p.set("q", q.value.trim());
    if (effectSel.value) p.set("effect", effectSel.value);
    if (kind) p.set("kind", kind);
    const s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
  }

  function haystack(it) {
    return it._hay || (it._hay = [it.name, (it.effects || []).join(" "), (it.kinds || []).join(" "), it.caption, it.about, it.artist].join(" ").toLowerCase());
  }

  function filter() {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const eff = effectSel.value;
    shown = items.filter((it) =>
      (!eff || (eff === "Other" ? !(it.effects && it.effects.length) : (it.effects || []).includes(eff))) &&
      (!kind || (it.kinds || []).includes(kind)) &&
      words.every((w) => haystack(it).includes(w)));
    grid.textContent = "";
    drawn = 0;
    draw();
    const filtered = words.length || eff || kind;
    count.textContent = items.length ? (filtered ? num(shown.length) + " of " + num(items.length) + " pictures" : "") : "";
    count.hidden = !count.textContent;
    empty.hidden = shown.length > 0 || !items.length;
    if (items.length && !shown.length) empty.textContent = "Nothing matches that. Try another word or effect.";
    remember();
  }

  function tile(it, i) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rp-tile";
    b.dataset.i = String(i);
    const label = effectOf(it) + (it.artist ? " by " + it.artist : "");
    b.setAttribute("aria-label", label);
    const box = document.createElement("span");
    box.className = "rp-tile-pic";
    if (isVideo(it) && !it.thumb) {
      const v = document.createElement("video");
      v.src = fileUrl(it) + "#t=0.1";
      v.muted = true;
      v.playsInline = true;
      v.preload = "metadata";
      v.setAttribute("aria-hidden", "true");
      box.append(v);
    } else {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = thumbUrl(it);
      img.addEventListener("error", () => box.classList.add("is-broken"), { once: true });
      box.append(img);
    }
    if (it.mime === "image/gif" || isVideo(it)) {
      const tag = document.createElement("span");
      tag.className = "rp-tag";
      tag.textContent = isVideo(it) ? "Video" : "GIF";
      box.append(tag);
    }
    const cap = document.createElement("span");
    cap.className = "rp-tile-cap";
    const t = document.createElement("b");
    t.textContent = effectOf(it);
    cap.append(t);
    if (it.artist) {
      const a = document.createElement("small");
      a.textContent = it.artist;
      cap.append(a);
    }
    b.append(box, cap);
    li.append(b);
    return li;
  }

  function draw() {
    const end = Math.min(shown.length, drawn + PAGE);
    const frag = document.createDocumentFragment();
    for (let i = drawn; i < end; i++) frag.append(tile(shown[i], i));
    grid.append(frag);
    drawn = end;
    more.hidden = drawn >= shown.length;
    more.textContent = "Show more (" + num(shown.length - drawn) + " left)";
  }
  more.addEventListener("click", draw);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((entries) => { if (entries.some((e) => e.isIntersecting) && !more.hidden) draw(); }, { rootMargin: "600px 0px" }).observe(more);
  }

  function fillFilters() {
    const byEffect = new Map();
    const byKind = new Map();
    let other = 0;
    items.forEach((it) => {
      if (!it.effects || !it.effects.length) other++;
      (it.effects || []).forEach((e) => byEffect.set(e, (byEffect.get(e) || 0) + 1));
      (it.kinds || []).forEach((k) => byKind.set(k, (byKind.get(k) || 0) + 1));
    });
    const want = params.get("effect") || effectSel.value;
    effectSel.textContent = "";
    effectSel.append(new Option("All effects (" + num(items.length) + ")", ""));
    [...byEffect.keys()].sort((a, b) => a.localeCompare(b)).forEach((e) => effectSel.append(new Option(e + " (" + byEffect.get(e) + ")", e)));
    if (other) effectSel.append(new Option("Other (" + other + ")", "Other"));
    effectSel.value = [...effectSel.options].some((o) => o.value === want) ? want : "";

    const kinds = [...byKind.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map((e) => e[0]);
    kindsBox.textContent = "";
    kindsBox.hidden = kinds.length < 2;
    if (kinds.length < 2) { kind = ""; return; }
    if (kind && !kinds.includes(kind)) kind = "";
    ["", ...kinds].forEach((k) => {
      const c = document.createElement("button");
      c.type = "button";
      c.className = "rp-chip";
      c.dataset.kind = k;
      c.setAttribute("aria-pressed", String(k === kind));
      c.textContent = k || "All";
      if (k) {
        const s = document.createElement("small");
        s.textContent = byKind.get(k);
        c.append(" ", s);
      }
      kindsBox.append(c);
    });
  }
  kindsBox.addEventListener("click", (e) => {
    const c = e.target.closest(".rp-chip");
    if (!c) return;
    kind = c.dataset.kind;
    kindsBox.querySelectorAll(".rp-chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
    filter();
  });
  let typing;
  q.addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(filter, 150); });
  effectSel.addEventListener("change", filter);

  function showMeta(data) {
    if (!items.length) {
      meta.textContent = "";
      empty.hidden = false;
      empty.textContent = admin ? "Nothing backed up yet. Press Back up now to download them from PsychonautWiki." : "Nothing here yet. An admin needs to back up the replications first.";
      return;
    }
    const when = data.updated ? new Date(data.updated).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
    meta.textContent = num(items.length) + " pictures · " + size(data.bytes || 0) + (when ? " · updated " + when : "");
  }

  async function load() {
    try {
      const res = await fetch("/replications/list", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status === 401 ? "Log in again to see these." : "Couldn't load the replications.");
      const data = await res.json();
      admin = !!data.admin;
      items = (data.items || []).slice().sort((a, b) => effectOf(a) === "Other" ? 1 : effectOf(b) === "Other" ? -1 : effectOf(a).localeCompare(effectOf(b)) || a.name.localeCompare(b.name));
      fillFilters();
      filter();
      showMeta(data);
      if (data.status) backupStatus(data.status);
    } catch (error) {
      empty.hidden = false;
      empty.textContent = error.message;
    }
  }

  // ---- the picture viewer ----
  const view = document.getElementById("view");
  const vMedia = document.getElementById("vMedia");
  let at = 0;
  function fact(dl, name, value, link) {
    if (!value) return;
    const dt = document.createElement("dt");
    dt.textContent = name;
    const dd = document.createElement("dd");
    if (link) {
      const a = document.createElement("a");
      a.href = link;
      a.textContent = value;
      dd.append(a);
    } else dd.textContent = value;
    dl.append(dt, dd);
  }
  function open(i) {
    if (!shown.length) return;
    at = (i + shown.length) % shown.length;
    const it = shown[at];
    vMedia.textContent = "";
    if (isVideo(it)) {
      const v = document.createElement("video");
      v.src = fileUrl(it);
      v.controls = true;
      v.loop = true;
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      vMedia.append(v);
    } else {
      const img = document.createElement("img");
      img.alt = effectOf(it) + (it.artist ? " by " + it.artist : "");
      img.src = fileUrl(it);
      vMedia.append(img);
    }
    document.getElementById("vTitle").textContent = (it.effects && it.effects.length ? it.effects.join(", ") : "Replication");
    document.getElementById("vCount").textContent = shown.length > 1 ? num(at + 1) + " of " + num(shown.length) : "";
    const cap = document.getElementById("vCaption");
    cap.textContent = it.caption || "";
    cap.hidden = !it.caption;
    const about = document.getElementById("vAbout");
    about.textContent = it.about && it.about !== it.caption ? it.about : "";
    about.hidden = !about.textContent;
    const dl = document.getElementById("vFacts");
    dl.textContent = "";
    fact(dl, "Artist", it.artist);
    fact(dl, "License", it.license);
    fact(dl, "Picture", (it.width && it.height ? it.width + " × " + it.height + " · " : "") + size(it.bytes || 0));
    fact(dl, "File", it.name);
    const src = document.getElementById("vSource");
    src.hidden = !it.source;
    if (it.source) src.href = it.source;
    const full = document.getElementById("vOpen");
    full.href = fileUrl(it);
    view.querySelectorAll("[data-step]").forEach((b) => (b.hidden = shown.length < 2));
    resetRemove();
    if (!view.open) {
      view.showModal();
      document.documentElement.classList.add("xn-modal-open");
      view.querySelector("[data-close]").focus({ preventScroll: true });
    }
  }
  grid.addEventListener("click", (e) => {
    const b = e.target.closest(".rp-tile");
    if (b) open(Number(b.dataset.i));
  });
  view.addEventListener("click", (e) => {
    if (e.target === view || e.target.closest("[data-close]")) return view.close();
    const step = e.target.closest("[data-step]");
    if (step) open(at + Number(step.dataset.step));
  });
  view.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select")) return;
    if (e.key === "ArrowLeft") open(at - 1);
    if (e.key === "ArrowRight") open(at + 1);
  });
  view.addEventListener("close", () => {
    document.documentElement.classList.remove("xn-modal-open");
    vMedia.textContent = "";
    const tileNow = grid.querySelector('.rp-tile[data-i="' + at + '"]');
    if (tileNow) tileNow.focus({ preventScroll: false });
  });
  // Swipe sideways on the picture for the next one.
  let sx = null, sy = 0;
  vMedia.addEventListener("touchstart", (e) => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
  vMedia.addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && shown.length > 1) open(at + (dx < 0 ? 1 : -1));
  });

  const removeBtn = document.getElementById("vRemove");
  function resetRemove() {
    if (!removeBtn) return;
    removeBtn.textContent = "Remove";
    delete removeBtn.dataset.sure;
  }
  if (removeBtn) removeBtn.addEventListener("click", async () => {
    if (!removeBtn.dataset.sure) {
      removeBtn.dataset.sure = "1";
      removeBtn.textContent = "Remove for good?";
      return;
    }
    const it = shown[at];
    removeBtn.disabled = true;
    try {
      const res = await fetch("/replications/backup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "remove", name: it.name }) });
      if (!res.ok) throw new Error((await res.text()).trim() || "Couldn't remove that.");
      items = items.filter((x) => x !== it);
      const keep = at;
      fillFilters();
      filter();
      showMeta({ updated: Date.now(), bytes: items.reduce((s, x) => s + (x.bytes || 0), 0) });
      toast("Removed. Updates won't download it again.");
      if (shown.length) open(Math.min(keep, shown.length - 1)); else view.close();
    } catch (error) {
      toast(error.message, true);
    } finally {
      removeBtn.disabled = false;
    }
  });

  // ---- admins: the backup button and its progress ----
  const bk = document.getElementById("backup");
  let polling = null;
  function backupStatus(st) {
    if (!bk) return;
    const start = document.getElementById("bkStart");
    const stop = document.getElementById("bkStop");
    const prog = document.getElementById("bkProgress");
    const bar = document.getElementById("bkBar");
    const phase = document.getElementById("bkPhase");
    start.hidden = st.running;
    stop.hidden = !st.running;
    stop.disabled = /Stopping/.test(st.phase || "");
    start.textContent = items.length ? "Update" : "Back up now";
    prog.hidden = !st.running && !st.finished;
    const pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
    bar.setAttribute("aria-valuenow", String(st.running ? pct : 100));
    bar.style.setProperty("--p", (st.running ? pct : 100) + "%");
    bar.classList.toggle("is-busy", st.running && !st.total);
    if (st.running) {
      phase.textContent = (st.phase || "Working") + (st.total ? ": " + num(st.done) + " of " + num(st.total) : "") + (st.bytes ? " · " + size(st.bytes) + " downloaded" : "");
    } else if (st.finished) {
      const when = new Date(st.finished).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
      const parts = [];
      if (st.new) parts.push(num(st.new) + " new");
      if (st.failed) parts.push(num(st.failed) + " couldn't download");
      phase.textContent = (st.phase === "Done" ? "Finished " : st.phase + " · ") + when + (parts.length ? ": " + parts.join(", ") : st.phase === "Done" ? ": nothing new" : "") + (st.error ? ". " + st.error : "") + ".";
      phase.classList.toggle("is-bad", !!st.error);
    }
    if (st.running && !polling) polling = setInterval(poll, 1500);
    if (!st.running && polling) {
      clearInterval(polling);
      polling = null;
      load();
    }
  }
  async function poll() {
    try {
      const res = await fetch("/replications/backup", { cache: "no-store" });
      if (res.ok) backupStatus(await res.json());
    } catch (e) { /* try again next tick */ }
  }
  async function act(action) {
    try {
      const res = await fetch("/replications/backup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action }) });
      if (!res.ok) throw new Error(res.status === 403 ? "Only admins can do that." : "Couldn't reach the server.");
      backupStatus(await res.json());
    } catch (error) {
      toast(error.message, true);
    }
  }
  if (bk) {
    document.getElementById("bkStart").addEventListener("click", () => act("start"));
    document.getElementById("bkStop").addEventListener("click", () => act("stop"));
  }

  load();
})();
</script>
</body>
</html>
