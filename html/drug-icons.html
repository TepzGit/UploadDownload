<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drug icons · Geek⁴u</title>
  <link rel="stylesheet" href="/oled.css" />
  <link rel="stylesheet" href="/drug-icons-admin.css" />
  <script src="/nav.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>
<main class="xn-page dia-page">
  <a class="dia-back" href="/admin">← Admin</a>
  <section class="xn-card dia-card">
    <form id="diaForm" class="dia-form">
      <label class="dia-field">
        <span class="xn-label">Drug name</span>
        <input class="xn-input" id="diaName" maxlength="100" required autocomplete="off" placeholder="For example, LSD">
      </label>
      <label class="dia-field">
        <span class="xn-label">Custom picture <span class="dia-hint">JPG, PNG, GIF or WebP; up to 10 MB</span></span>
        <input id="diaImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
      </label>
      <div class="dia-preview-wrap">
        <img id="diaPreview" class="dia-preview" alt="" hidden>
        <span id="diaDefault" class="dia-default">Default icon</span>
      </div>
      <div class="dia-actions">
        <button class="xn-btn xn-btn-primary" id="diaSave" type="submit">Save custom picture</button>
        <button class="xn-btn" id="diaReset" type="button">Use default icon</button>
      </div>
    </form>
    <p id="diaStatus" class="dia-status" role="status" aria-live="polite"></p>
  </section>
  <section class="xn-card dia-card">
    <h2 class="xn-h2">Custom drug pictures</h2>
    <label class="dia-field dia-search">
      <span class="xn-label">Find a drug</span>
      <input class="xn-input" id="diaSearch" autocomplete="off" placeholder="Filter custom pictures">
    </label>
    <ul class="dia-list" id="diaList"><li class="dia-empty">Loading…</li></ul>
  </section>
</main>
<script src="/drug-icons-admin.js" defer></script>
</body>
</html>
