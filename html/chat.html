<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chat · Geek⁴u</title>
  <meta name="description" content="Private messages and group chats.">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geek⁴u" />
  <link rel="stylesheet" href="/oled.css" />
  <script src="/nav.js"></script>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/chat.css" />
</head>
<body class="xn-bg">
{{template "xn-header" .}}
<div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
<div class="xn-hatch" aria-hidden="true"></div>

<main class="xn-page ch" id="chat">
  <aside class="ch-side" aria-label="Chats">
    <div class="ch-side-head">
      <button type="button" class="ch-icon-btn" id="chNew" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <label class="ch-find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="chFind" placeholder="Search chats" autocomplete="off"></label>
    <ul class="ch-list" id="chList" role="list"></ul>
    <p class="ch-empty" id="chListEmpty" hidden>No chats yet. Press the pencil to message someone or start a group.</p>
  </aside>

  <section class="ch-pane" id="chPane" aria-live="polite">
    <div class="ch-none" id="chNone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <p>Pick a chat, or start a new one.</p>
      <button type="button" class="xn-btn xn-btn-primary" id="chNone2">New chat</button>
    </div>
    <header class="ch-head" id="chHead" hidden>
      <button type="button" class="ch-icon-btn ch-back" id="chBack" aria-label="Back to chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      <a class="ch-head-who" id="chWho"><span class="ch-av" id="chHeadAv"></span><span class="ch-head-text"><strong id="chHeadName"></strong><small id="chHeadSub"></small></span></a>
      <div class="ch-menu-wrap">
        <button type="button" class="ch-icon-btn" id="chMore" aria-label="Chat options" aria-haspopup="menu" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
        <div class="ch-menu" id="chMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="rename">Rename group</button>
          <button type="button" role="menuitem" data-act="add">Add people</button>
          <button type="button" role="menuitem" data-act="members">Members</button>
          <button type="button" role="menuitem" data-act="leave" class="is-bad">Leave group</button>
        </div>
      </div>
    </header>
    <div class="ch-msgs" id="chMsgs" hidden>
      <button type="button" class="ch-older" id="chOlder" hidden>Show older messages</button>
      <div id="chMsgList"></div>
    </div>
    <button type="button" class="ch-down" id="chDown" aria-label="Jump to newest" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span id="chDownN"></span></button>
    <form class="ch-compose" id="chForm" hidden autocomplete="off">
      <div class="ch-reply" id="chReply" hidden><span class="ch-reply-text"><strong id="chReplyWho"></strong><span id="chReplyBody"></span></span><button type="button" class="ch-icon-btn" id="chReplyX" aria-label="Cancel reply"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="ch-pic-preview" id="chPicPrev" hidden><img id="chPicImg" alt=""><button type="button" class="ch-icon-btn" id="chPicX" aria-label="Remove picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="ch-compose-row">
        <label class="ch-icon-btn ch-attach" title="Send a picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg><input type="file" id="chPic" accept="image/jpeg,image/png,image/gif,image/webp" hidden><span class="xn-sr">Send a picture</span></label>
        <textarea id="chText" rows="1" maxlength="4000" placeholder="Message" aria-label="Message"></textarea>
        <button type="submit" class="ch-send" id="chSend" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"/><path d="m11 13 9-9"/></svg></button>
      </div>
    </form>
  </section>
</main>

<dialog class="ch-dlg" id="chNewDlg" aria-labelledby="chNewTitle">
  <form method="dialog" class="ch-dlg-card xn-card" id="chNewForm">
    <div class="ch-dlg-head"><h2 class="xn-h2" id="chNewTitle">New chat</h2><button type="button" class="ch-icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="ch-seg" role="tablist">
      <button type="button" role="tab" class="ch-seg-btn" data-mode="dm" aria-selected="true">Message</button>
      <button type="button" role="tab" class="ch-seg-btn" data-mode="group" aria-selected="false">Group</button>
    </div>
    <input type="text" class="xn-input" id="chGroupName" maxlength="60" placeholder="Group name" hidden>
    <div class="ch-picked" id="chPicked" hidden></div>
    <input type="search" class="xn-input" id="chPeopleFind" placeholder="Search members" autocomplete="off">
    <ul class="ch-people" id="chPeople" role="list"></ul>
    <p class="fi-msg ch-dlg-msg" id="chNewMsg" role="status"></p>
    <div class="ch-dlg-foot" id="chGroupFoot" hidden><button type="button" class="xn-btn" data-close>Cancel</button><button type="button" class="xn-btn xn-btn-primary" id="chMakeGroup">Start group</button></div>
  </form>
</dialog>

<dialog class="ch-viewer" id="chViewer" aria-label="Picture"><img id="chViewerImg" alt=""><button type="button" class="ch-icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></dialog>

<script type="module" src="/chat.js"></script>
</body>
</html>
