
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drug Database · Geek⁴u</title>
  <link href="/vendor/daisyui-4.12.10.css" rel="stylesheet" type="text/css" />
  <style>
    :root{ --bg:#000000; --surface:#0a0a0c; --surface-2:#121216; --line:#23202b; --text:#f5f3fa; --muted:#9c96aa; --violet:var(--oled-accent); }
    body{ color:var(--text); }
    .jr-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; }
    .jr-search{ position:relative; width:100%; max-width:340px; }
    .jr-search svg{ position:absolute; left:11px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--muted); pointer-events:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; }
    .jr-search .xn-input{ padding-left:34px; }
    /* Rows keep the card's height even when only a few substances fill the box,
       so each heart stays in the middle of its card. */
    .Drugs{ align-content:start; }
    .drug-item{ position:relative; align-self:start; }
    .drug-item .drug-like{ position:absolute; top:50%; right:8px; transform:translateY(-50%); }
    .Drug{ display:grid;
        grid-template-columns:100px minmax(0,1fr) 44px;
        align-items:center;
        gap:14px;
        height:100px;
        min-height:120px;
        padding:10px 10px 10px 10px;
        border:1px solid var(--line);
        border-radius:2px;
        background:var(--surface-2);
        color:var(--text);
        text-decoration:none;
        transition:border-color .15s ease, background-color .15s ease;
        }
    @media (hover:hover){ .Drug:hover{ border-color:var(                                                                                                                                                                                                                --violet); background:#16161b; } }
    .Drug:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
    .drug-thumb {
        display:flex;
        align-items:center;
        justify-content:center;
        width:100px;
        height:100px;
        overflow:hidden;
        border:1px solid var(--line);
        border-radius:2px;
        background:#000;
        color:var(--violet);
        font-size:20px;
        font-weight:600;
        }

    /* Wiki structure drawings are black on white/clear; inverting them suits the black theme. */
    .drug-thumb img{ width:100%; height:100%; object-fit:contain; padding:4px; filter:invert(1) hue-rotate(180deg); }
    .drug-thumb{ position:relative; background:radial-gradient(circle at 50% 40%, #1c1b22, #050506 75%); }
    .drug-thumb .ft-svg{ width:84%; height:84%; }
    /* Custom admin picture or a medicine's real pill picture covers the drawing. */
    .drug-thumb .drug-thumb-own{ display:none; }
    .drug-thumb img.drug-pill{ filter:none; padding:7px; }
    .drug-thumb .drug-thumb-own.has-custom-image,
    .drug-thumb .drug-thumb-own[data-class^="pill-"]{ display:block; position:absolute; inset:10%; width:auto; height:auto; margin:0; }
    .drug-thumb:has(.drug-thumb-own.has-custom-image, .drug-thumb-own[data-class^="pill-"]) .ft-svg{ visibility:hidden; }
    .drug-text{ display:flex; flex-direction:column; gap:3px; min-width:0; text-align:center; }
    .drugname{ margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
    .drugclass{ margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--muted); }
    /* "Medicine" / "Custom" tag after the name (journal.css isn't loaded on this page) */
    .drug-custom{ display:inline-block; margin-left:8px; padding:0 6px; border:1px solid var(--line); border-radius:2px; font-size:10px; font-weight:500; line-height:16px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); vertical-align:2px; }
    /* Pill Database link in the intro (mommy 2026-11-05) */
    .jr-portal .xn-sub a{ color:var(--oled-accent); text-decoration:underline; text-underline-offset:3px; }
    /* Scrolling list: spacers stand in for the cards above and below the screen. */
    .jr-spacer{ grid-column:1 / -1; pointer-events:none; }
    .jr-spacer[hidden]{ display:none; }
    .Drugs.is-settled > *{ animation:none !important; }
    .bottombar[hidden]{ display:none; }
    .jr-top{ position:fixed; z-index:40; right:max(16px, env(safe-area-inset-right)); bottom:calc(var(--xn-tabs-h, 0px) + 16px + env(safe-area-inset-bottom)); display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:999px; box-shadow:0 10px 28px -10px rgba(0,0,0,.9); }
    .jr-top[hidden]{ display:none; }
    .jr-top svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-reduced-motion:no-preference){ .jr-top:not([hidden]){ animation:jr-drop .18s ease-out; } }
    .jr-status{ grid-column:1 / -1; margin:0; padding:40px 12px; text-align:center; font-size:12px; color:var(--muted); }
    /* Class dropdown: a button with the picked class, the list opens under it. */
    /* Categories row (mommy 2026-11-06): the biggest classes as tiles. */
    .jr-cats { display: flex; gap: 8px; margin: 14px 0 4px; padding: 2px 2px 8px; overflow-x: auto; scrollbar-width: thin; scroll-snap-type: x proximity; }
    .jr-cats[hidden] { display: none; }
    .jr-cat { display: grid; justify-items: center; gap: 6px; flex: none; min-width: 96px; padding: 12px 10px 10px; border: 1px solid var(--oled-line); border-radius: 14px; background: var(--oled-surface); color: var(--oled-muted); font: inherit; font-size: 12.5px; cursor: pointer; scroll-snap-align: start; transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease, transform 0.15s ease; }
    .jr-cat-ic { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid rgba(var(--xn-accent-rgb), 0.25); border-radius: 11px; background: var(--oled-accent-soft); color: var(--oled-accent); }
    .jr-cat-ic svg, .jr-cat-ic .jr-chip-icon { width: 22px; height: 22px; margin: 0; fill: currentColor; }
    .jr-cat-name { max-width: 120px; overflow: hidden; color: var(--oled-text); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .jr-cat small { font-size: 11px; opacity: 0.75; }
    .jr-cat[aria-pressed="true"] { border-color: var(--oled-accent); background: var(--oled-accent-soft); }
    @media (hover: hover) { .jr-cat:hover { border-color: rgba(var(--xn-accent-rgb), 0.5); transform: translateY(-2px); } }
    .jr-cat:active { transform: scale(0.97); }
    .jr-cat:focus-visible { outline: 2px solid var(--oled-accent); outline-offset: 2px; }
    /* The class dropdown is gone (mommy 2026-11-06): the category tiles filter. */
    .jr-classpick, .jr-classpick:not([hidden]){ display:none !important; }
    .jr-classpick{ position:relative; display:inline-block; margin-top:16px; z-index:30; }
    .jr-classpick[hidden]{ display:none; }
    .jr-class-btn{ display:inline-flex; align-items:center; gap:10px; min-width:260px; max-width:100%; min-height:40px; padding:0 12px 0 14px; border:1px solid var(--line); border-radius:2px; background:var(--surface-2); color:var(--text); font:inherit; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .jr-class-btn:focus-visible{ outline:2px solid var(--oled-accent); outline-offset:1px; }
    .jr-classpick.is-open .jr-class-btn{ border-color:var(--oled-accent); }
    .jr-class-now{ display:inline-flex; align-items:center; gap:8px; flex:1; min-width:0; white-space:nowrap; }
    .jr-class-now .sc-icon{ width:15px; height:15px; margin:0; }
    .jr-class-now small{ margin-left:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .jr-class-chev{ width:16px; height:16px; flex:none; fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .18s ease; }
    .jr-classpick.is-open .jr-class-chev{ transform:rotate(180deg); }
    @media (hover:hover){ .jr-class-btn:hover{ border-color:var(--oled-line-strong); } }
    .jr-classes{ position:absolute; top:calc(100% + 6px); left:0; display:flex; flex-direction:column; gap:2px; width:max(100%, 280px); max-height:min(60vh, 420px); padding:6px; overflow-y:auto; border:1px solid var(--oled-line-strong); border-radius:2px; background:var(--oled-surface); box-shadow:0 18px 40px -12px rgba(0,0,0,.85); scrollbar-width:thin; }
    .jr-classes[hidden]{ display:none; }
    .jr-chip{ display:flex; align-items:center; gap:10px; width:100%; min-height:38px; padding:0 10px; border:1px solid transparent; border-radius:2px; background:transparent; color:var(--muted); font:inherit; font-size:13px; text-align:left; cursor:pointer; white-space:nowrap; transition:color .15s ease, background-color .15s ease; -webkit-tap-highlight-color:transparent; }
    .jr-chip .sc-icon{ width:15px; height:15px; margin:0; }
    .jr-chip small{ margin-left:auto; font-size:11px; opacity:.75; font-variant-numeric:tabular-nums; }
    .jr-chip[aria-pressed="true"]{ background:var(--oled-accent-soft); color:var(--text); }
    @media (hover:hover){ .jr-chip:hover{ color:var(--text); background:var(--surface-2); } }
    @media (prefers-reduced-motion:no-preference){ .jr-classpick.is-open .jr-classes{ animation:jr-drop .16s ease-out; } }
    @keyframes jr-drop{ from{ opacity:0; transform:translateY(-4px); } }
    @media (max-width:640px){ .jr-classpick, .jr-class-btn{ display:flex; width:100%; } .jr-classes{ width:100%; } }
    .jr-chip:focus-visible{ outline:2px solid var(--oled-accent); outline-offset:1px; }
    /* Wikipedia-style portal over the molecule background (mommy 2026-11-02, see DruginfoPage.css). */
    body:has(.jr-portal){ background:#07090c; }
    .xn-card.jr-portal{ --oled-surface: rgba(16,20,24,.94); background:rgba(16,20,24,.94); border-color:#2a2e35; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
    .jr-title{ --oled-font:"Linux Libertine", Georgia, "Times New Roman", Times, serif; font-weight:400 !important; letter-spacing:0 !important; font-size:clamp(1.8rem,3.4vw,2.5rem) !important; }
    .jr-tagline{ --oled-font:"Linux Libertine", Georgia, "Times New Roman", Times, serif; margin:2px 0 10px; font-size:1.05rem; color:#c8ccd1; }
    .jr-tagline a{ color:#88a3e8; text-decoration:none; }
    .jr-portal .jr-head{ padding-bottom:14px; border-bottom:1px solid #3a3f47; }
    .jr-count{ margin:12px 0 0; font-size:12px; color:var(--muted); }
    .jr-count:empty{ display:none; }
    @media (max-width:640px){ .jr-search{ max-width:none; } .bottombar .xn-btn{ flex:1; } }
    /* Phones: one card per row and a smaller picture, so the name has room. */
    /* Square cards, 6 per row (mommy 2026-11-06): the picture in the middle,
       the name under it, the heart and the class icon in the top corner. */
    .xn-page .Drugs{ grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; }
    .Drug{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; height:auto; min-height:196px; padding:30px 10px 18px; border-radius:4px; }
    .drug-thumb{ width:72px; height:72px; border:0; background:none; overflow:visible; }
    .drug-thumb .ft-svg{ width:100%; height:100%; }
    .drug-thumb img.drug-pill{ padding:0; }
    .drug-text{ width:100%; }
    .drugname{ display:block; font-size:13.5px; }
    .drugname > .sc-icon, .drugclass, .drug-custom{ display:none; }
    .drug-corner{ position:absolute; top:6px; right:6px; display:flex; align-items:center; gap:2px; padding:2px; border:1px solid var(--line); border-radius:8px; background:rgba(0,0,0,.55); }
    .drug-corner .drug-cls{ flex:none; width:18px; height:18px; margin:0 3px; }
    .drug-cls-wrap{ display:inline-flex; align-items:center; height:26px; outline:none; cursor:default; }
    .drug-cls-name{ max-width:0; overflow:hidden; opacity:0; color:var(--text); font-size:11.5px; font-weight:600; white-space:nowrap; text-transform:capitalize; transition:max-width .35s cubic-bezier(.2,.8,.2,1), opacity .2s ease, padding .35s ease; }
    .drug-cls-wrap:is(:hover, :focus-visible) .drug-cls-name{ max-width:150px; opacity:1; padding:0 6px 0 2px; }
    .drug-corner{ transition:border-color .2s ease, background-color .2s ease; }
    .drug-corner:has(.drug-cls-wrap:hover){ border-color:rgba(var(--xn-accent-rgb), .5); background:rgba(0,0,0,.85); }
    .drug-item .drug-corner .drug-like{ position:static; transform:none; width:26px; height:26px; min-width:0; min-height:0; padding:0; }
    .drug-item .drug-corner .drug-like svg{ width:16px; height:16px; }
    @media (hover:hover){ .Drug{ transition:border-color .15s ease, background-color .15s ease, transform .15s ease; } .Drug:hover{ transform:translateY(-2px); } }
    @media (max-width:1279px){ .xn-page .Drugs{ grid-template-columns:repeat(5, minmax(0,1fr)); } }
    @media (max-width:1099px){ .xn-page .Drugs{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
    @media (max-width:899px){ .xn-page .Drugs{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
    @media (max-width:560px){ .xn-page .Drugs{ grid-template-columns:repeat(2, minmax(0,1fr)); } .drug-thumb{ width:60px; height:60px; } }
  </style>

<body class="min-h-screen xn-bg">
  {{template "xn-header" .}}

  <div class="xn-fluid" aria-hidden="true"><span class="xn-b1"></span><span class="xn-b2"></span><span class="xn-b3"></span><span class="xn-b4"></span></div>
  <div class="xn-hatch" aria-hidden="true"></div>

  <div class="wk-backdrop" aria-hidden="true"></div>
  <main class="xn-page">
    <section class="xn-card jr-portal">
      <div class="jr-head">
        <div>
        </div>
        <label class="jr-search">
          <span class="xn-sr">Search substances</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="input" type="search" placeholder="Search substances..." class="xn-input" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
        </label>
      </div>

      <div id="sug" class="mt-3 hidden">
        <div id="sugC" class="rounded-sm border border-[#23202b] bg-[#121216] p-2"></div>
      </div>

      <div class="jr-cats" id="catRow" role="group" aria-label="Categories" hidden></div>
      <div class="jr-classpick" id="classPick" hidden>
        <button type="button" class="jr-class-btn" id="classBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="classChips">
          <span class="jr-class-now" id="classNow">All</span>
          <svg class="jr-class-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="jr-classes" id="classChips" role="listbox" aria-label="Filter by class" hidden></div>
      </div>
      <p class="jr-count" id="classCount" aria-live="polite"></p>

      <div class="Drugs" aria-live="polite"><p class="jr-status">Loading substances…</p></div>

      <div class="bottombar" hidden>
        <button type="button" class="xn-btn" id="backBtn" onclick="previousPage()" disabled>← Back</button>
        <button type="button" class="xn-btn" id="nextBtn" onclick="nextPage()" disabled>Forward →</button>
      </div>
    </section>
  </main>

  <script>
            const PAGE = 10;
            let currentOffset = 0;
            let currentSearchQuery = "";
            let currentClass = "";
            let catalog = null; // every substance, once loaded; null = use the API page by page

            async function getSubstances(offset, query = "") {
                let gql;
                if (query) {
                    gql = `{
                      substances(query: "${query}") {
                        name
                        class{
                            chemical
                        }
                        images{thumb}
                      }
                    }`;
                } else {
                    gql = `{
                      substances(limit: 10 offset: ${offset}) {
                        name
                        class{
                            chemical
                        }
                        images{
                            thumb
                        }
                      }
                    }`;
                }
                return fetchGraphQL(gql);
            }

            // The class filter needs the whole catalog, so it's fetched once
            // (a few big pages) and kept for this browser tab.
            const CATALOG_KEY = "xn_pw_catalog_v1";
            // Offline (the phone app), the list comes from the substances the
            // Graph saved on the phone (offline.js).
            const offlineStore = import("/offline.js").catch(() => null);
            // Custom substances (added by an admin in the Substances Importer) join the list, marked Custom.
            const customLoad = import("/logic.js").then((m) => m.customSubstances()).catch(() => []);
            // Pictures of real pills (js/pills.js): a medicine shows its own pill.
            const pillsLoad = Promise.all([window.xnPills ? window.xnPills.load() : [], customLoad])
                .then(([pills, custom]) => window.xnPills.match(pills, custom)).catch(() => []);
            async function withCustom(all) {
                const custom = await customLoad;
                const taken = new Set(custom.map((c) => c.name.toLowerCase()));
                return [...custom, ...all.filter((s) => !taken.has(String(s.name || "").toLowerCase()))]
                    .sort((a, b) => String(a.name).localeCompare(String(b.name)));
            }
            async function savedCatalog() {
                const store = await offlineStore;
                const all = store ? await store.allSubstances() : [];
                if (!all.length) throw new Error("nothing saved on this phone");
                return all.sort((a, b) => a.name.localeCompare(b.name));
            }
            async function loadCatalog() {
                try {
                    const saved = JSON.parse(sessionStorage.getItem(CATALOG_KEY) || "null");
                    if (saved && saved.length) return saved;
                } catch (_) {}
                if (!navigator.onLine) return savedCatalog();
                try {
                    return await downloadCatalog();
                } catch (error) {
                    if (!(error instanceof TypeError)) throw error;
                    return savedCatalog();
                }
            }
            async function downloadCatalog() {
                const all = [];
                for (let offset = 0; offset < 4000; offset += 250) {
                    const result = await fetchGraphQL(`{
                      substances(limit: 250 offset: ${offset}) {
                        name
                        commonNames
                        class{ chemical psychoactive }
                        images{ thumb }
                      }
                    }`);
                    const page = result?.data?.substances;
                    if (!Array.isArray(page)) throw new Error("catalog page failed");
                    all.push(...page);
                    if (page.length < 250) break;
                }
                if (!all.length) throw new Error("empty catalog");
                try { sessionStorage.setItem(CATALOG_KEY, JSON.stringify(all)); } catch (_) {}
                return all;
            }

            // "Stimulants" and "stimulant" are the same class.
            const classKey = (name) => String(name || "").trim().toLowerCase().replace(/s$/, "");
            // The Medicines chip: entries with an active ingredient (js/medicines.json and the Importer).
            const MEDICINES = "@medicine";
            const classesOf = (substance) => [].concat(substance?.class?.psychoactive || []).filter(Boolean);

            function buildChips() {
                const counts = new Map();
                catalog.forEach((substance) => {
                    new Set(classesOf(substance).map(classKey)).forEach((key) => {
                        const label = classesOf(substance).find((c) => classKey(c) === key).trim();
                        const entry = counts.get(key) || { key, count: 0, labels: new Map() };
                        entry.count++;
                        entry.labels.set(label, (entry.labels.get(label) || 0) + 1);
                        counts.set(key, entry);
                    });
                });
                const list = [...counts.values()].sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
                const box = document.getElementById("classChips");
                box.innerHTML = "";
                const chip = (key, label, count) => {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "jr-chip";
                    b.dataset.class = key;
                    b.setAttribute("role", "option");
                    b.setAttribute("aria-selected", String(key === currentClass));
                    b.setAttribute("aria-pressed", String(key === currentClass));
                    const iconKey = key === MEDICINES ? "tablet" : window.xnClass.keyForClass(key);
                    if (iconKey) b.append(window.xnClass.icon(iconKey, "jr-chip-icon"));
                    b.append(label);
                    if (count != null) {
                        const small = document.createElement("small");
                        small.textContent = count;
                        b.append(small);
                    }
                    b.addEventListener("click", () => {
                        currentClass = key;
                        box.querySelectorAll(".jr-chip").forEach((c) => {
                            c.setAttribute("aria-pressed", String(c === b));
                            c.setAttribute("aria-selected", String(c === b));
                        });
                        showPicked(b);
                        syncCats();
                        setClassOpen(false, true);
                        displaySubstances(0, currentSearchQuery);
                    });
                    return b;
                };
                box.append(chip("", "All", catalog.length));
                const medicines = catalog.filter((s) => s.ingredient).length;
                if (medicines) box.append(chip(MEDICINES, "Medicines", medicines));
                list.forEach((entry) => {
                    const label = [...entry.labels.entries()].sort((a, b) => b[1] - a[1])[0][0];
                    box.append(chip(entry.key, label.charAt(0).toUpperCase() + label.slice(1), entry.count));
                });
                document.getElementById("classPick").hidden = list.length === 0;
                showPicked(box.querySelector('.jr-chip[aria-pressed="true"]') || box.firstChild);
                buildCats(box, list);
            }

            // Categories (mommy 2026-11-06): the biggest classes as a row of
            // tiles above the dropdown, one tap to filter. The dropdown keeps
            // every class.
            function buildCats(box, list) {
                const row = document.getElementById("catRow");
                row.replaceChildren();
                const keys = ["", MEDICINES].concat(list.map((e) => e.key));
                keys.forEach((key) => {
                    const chip = box.querySelector(`.jr-chip[data-class="${CSS.escape(key)}"]`);
                    if (!chip) return;

            // ---- Scrolling list (mommy 2026-11-05): every substance is in one list
            // you can scroll, but only the cards on screen plus a few rows above and
            // below are on the page. Spacers above and below keep the scroll bar the
            // size of the full list. The list scrolls in its own box (oled.css .Drugs),
            // or with the page if the box style is taken away.
            const virtualList = (function () {
                const BUFFER_ROWS = 4;      // rows kept above and below what you see
                const KEEP_BUILT = 240;     // cards remembered off the page, so scrolling back is instant
                const SPOT_KEY = "xn_drugdb_spot_v1";
                let items = [];
                let make = null;
                let built = new Map();      // index -> card
                let from = 0, to = 0;       // cards [from, to) are on the page
                let cols = 1, rowH = 0, gap = 8;
                let frame = 0;
                let listKey = "";
                let restoreOnce = true;
                const top = document.createElement("div");
                const bottom = document.createElement("div");

                bottom.setAttribute("aria-hidden", "true");

                const grid = () => document.querySelector(".Drugs");
                // True when the list scrolls inside its own box.
                const inBox = (el) => /^(auto|scroll)$/.test(getComputedStyle(el).overflowY);

                function card(i) {
                    let el = built.get(i);
                    if (!el) {
                        el = make(items[i]);
                        el.dataset.i = String(i);

                    }
                    return el;
                }
                function forgetFar() {
                    if (built.size <= KEEP_BUILT) return;
                    const mid = (from + to) / 2;
                    [...built.keys()].sort((x, y) => Math.abs(y - mid) - Math.abs(x - mid))
                        .slice(0, built.size - KEEP_BUILT)
                        .forEach((i) => { if (i < from || i >= to) built.delete(i); });
                }
                function columnsOf(el) {
                    return Math.max(1, getComputedStyle(el).gridTemplateColumns.split(" ").filter(Boolean).length);
                }
                // Row pitch (card height + gap), read from the cards on the page.
                function measure(el) {
                    gap = parseFloat(getComputedStyle(el).rowGap) || 0;
                    const kids = [...el.children].filter((c) => c.classList.contains("drug-item"));
                    if (kids.length > cols) {
                        const h = kids[cols].getBoundingClientRect().top - kids[0].getBoundingClientRect().top;
                        if (h > 20) return h;

                function place(el, a, b) {
                    const keep = document.activeElement;

                        for (let i = Math.max(b, from); i < to; i++) built.get(i)?.remove();

                        for (let i = a; i < from; i++) head.push(card(i));

                    const el = grid();
                    if (!el || !items.length || !make || !rowH) return;
                    const rows = Math.ceil(items.length / cols);
                    const v = view(el);
                    const firstRow = Math.max(0, Math.min(rows - 1, Math.floor(v.start / rowH) - BUFFER_ROWS));
                    const lastRow = Math.max(firstRow + 1, Math.min(rows, Math.ceil(v.end / rowH) + BUFFER_ROWS));
                    const a = firstRow * cols;
                    const b = Math.min(items.length, lastRow * cols);
                    if (a !== from || b !== to) {
                        place(el, a, b);
                        forgetFar();
                    }
                    setSpacers(rows);
                }
                function soon() {
                    if (!frame && items.length) frame = requestAnimationFrame(update);
                }
                // The first card you can see, so the place can be kept (resize) or remembered (Back).
                function spot() {
                    const el = grid();
                    if (!el || !rowH || !items.length) return null;
                    const v = view(el);
                    const row = Math.max(0, Math.floor(Math.max(0, v.start) / rowH));
                    return { index: row * cols, offset: row * rowH - v.start };
                }
                function goTo(index, offset) {
                    const el = grid();
                    const y = Math.floor(index / cols) * rowH - offset;
                    const v = view(el);
                    if (v.box) el.scrollTop = Math.max(0, y + v.pad);
                    else window.scrollTo(0, Math.max(0, window.scrollY - v.start + y));
                    update();
                }
                function layout(keepSpot) {
                    const el = grid();
                    const was = keepSpot ? spot() : null;
                    cols = columnsOf(el);
                    // Keep whole rows so the cards stay in their columns.
                    const a = Math.floor(Math.min(from, items.length) / cols) * cols;
                    if (a !== from || to > items.length) place(el, a, Math.min(to, items.length));
                    rowH = measure(el);
                    setSpacers(Math.ceil(items.length / cols));
                    if (was) goTo(was.index, was.offset);
                    else update();
                }

                // Scrolling the page or the list's own box (scroll events don't bubble, so listen while they pass down).
                document.addEventListener("scroll", soon, { passive: true, capture: true });
                let lastWidth = 0;
                window.addEventListener("resize", () => {
                    const el = grid();
                    const w = el ? el.clientWidth : 0;
                    if (!items.length) { lastWidth = w; return; }
                    if (w !== lastWidth) { lastWidth = w; layout(true); }
                    else soon(); // only the height changed (phone toolbar)
                });
                // Remember the place when a substance is opened, so Back returns to it.
                function remember() {
                    const s = spot();
                    if (!s) return;
                    try { sessionStorage.setItem(SPOT_KEY, JSON.stringify({ key: listKey, index: s.index, offset: s.offset, n: items.length })); } catch (_) {}
                }

                            restoreOnce = false;
                            try {
                                const saved = JSON.parse(sessionStorage.getItem(SPOT_KEY) || "null");

                    // For the Top button: is the list scrolled well down, and back to its start.
                    far() {

                        if (!el || !items.length) return false;
                        if (inBox(el)) {

                            return el.scrollTop > el.clientHeight * 1.5 && r.bottom > 80 && r.top < window.innerHeight - 80;

                        const behavior = smooth ? "smooth" : "auto";
                        if (inBox(el)) el.scrollTo({ top: 0, behavior });
                        const portal = document.querySelector(".jr-portal");
                        const y = portal ? portal.getBoundingClientRect().top + window.scrollY - 70 : 0;

            })();

            // "Top" button: shows once the list is scrolled well down.
            (function topButton() {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "xn-btn jr-top";

            let displaySeq = 0;

            async function displaySubstances(offset, query = "") {
                const seq = ++displaySeq;

                    if (catalog) {
                        // Every match in one scrolling list; only the cards near the screen are on the page.

                        const liked = await likesLoad;

                        const chip = document.querySelector(`.jr-chip[data-class="${CSS.escape(currentClass)}"]`);

                        document.getElementById("classCount").textContent = `${matches.length} ${matches.length === 1 ? "substance" : "substances"}${what ? " in " + what : ""}${query ? ` matching “${query}”` : ""}`;

                    if (!(await customLoad).length) throw error;

                    document.querySelector(".bottombar").hidden = false; // page by page from the API instead
                    if (!navigator.onLine) document.querySelector(".Drugs").innerHTML = `<p class="jr-status">You're offline, and no substances are saved on this phone yet. Open the Graph once with internet to save them.</p>`;

                inputField.addEventListener("input", (e) => {

                            displaySubstances(0, value);
                        }, catalog ? 120 : 300);

            <script>

        let timeout;
        document.querySelector("#input").addEventListener("input", (e) => {
            const value = e.target.value.trim();

            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            clearTimeout(timeout);

            timeout = setTimeout(() => {
                searchSuggestions();
            }, 500);
        });

        function searchSuggestions() {
			value = document.querySelector("#input").value
            if (value.length < 2) {
                document.getElementById("sug").style.visibility = "collapse";
                return;
            }

            const gql = `
            {
                substances(query: "${value}") {
                    name
                    class
                }
            }`;

            fetchGraphQL(gql).then(res => {
                document.getElementById("sug").style.visibility = "visible";

                showSuggestions(res.data.substances);
            });
        }

        function showSuggestions(substances) {
            const datalist = document.getElementById("sugC");
            datalist.innerHTML = ""; 

            substances.forEach(sub => {
                const option = document.createElement("p");
                option.textContent = sub.name;
                option.id = "sug1";
                datalist.appendChild(option);
                
                option.addEventListener("click", (e) => {
                    const value = option.textContent;
                    document.getElementById("input").value = value;
                    search();
                });
            });

			let index = -1
			children = datalist.children
			document.getElementById("input").addEventListener("keydown", (e) => {
				for (let i=0;i<children.length;i++) {
					if (children[i].classList.contains("Selected")) {
						children[i].classList.remove("Selected")
					}
				}

                if (event.key == "ArrowDown") {
					index += 1
					if (index > children.length - 1) {
						index = 0
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "ArrowUp") {
					index -= 1
					if (index < 0) {
						index = children.length - 1
					}
					children[index].classList.add("Selected")
				}

				if (event.key == "Enter") {
                    document.getElementById("input").value = children[index].textContent;
                    search();
				}
			})
        }



         function fetchGraphQL(query) {
            const url = "https://api.psychonautwiki.org";
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            }).then(r => r.json());
        }

        async function getData(substanceName) {
            const query = `
            {
                substances(query: "${substanceName}") {
                    name
                    images{thumb}
                    summary
                    addictionPotential
                    uncertainInteractions{name}
				    unsafeInteractions{name}
				    dangerousInteractions{name}

                    roas {
                        name
                        duration {
                            onset { min max units }
                            comeup { min max units }
                            peak { min max units }
                            offset { min max units }
                        }
                        dose {
                                units
                                common {
                                    min
                                }
                        }
                    }
                }
            }`;
            return fetchGraphQL(query);
        }

        var units = ""

		let onset = 0
		let comeup = 0
		let peak = 0
		let offset = 0

        async function search() {
            const substanceName = document.getElementById("input").value.trim();
            

            if (!substanceName) return;

            document.getElementById("sug").style.visibility = "collapse";

        
            status.textContent = "Loading...";
            const result = await getData(substanceName);
            console.log("RAW RESPONSE:", result);

            const substance = result?.data?.substances?.[0];
            if (!substance) {
                status.textContent = "No data found.";
                return;
            }

            const duration = substance.roas?.[0]?.duration;
            const dosage = substance.roas?.[0]?.dose;
            units = dosage.units
            
            if (!duration) {
                status.textContent = "No duration data.";
                return;
            }

            const commonDose = dosage?.common?.min;
            if (!commonDose) {
                status.textContent = "No common dose data found for this substance.";
                return;
            }

            currentSubstance = substance;
            currentCommonDose = commonDose;
            addedDoses = [];

            onset = DurationsIntoHour(duration.onset)
            comeup = DurationsIntoHour(duration.comeup)
            peak = DurationsIntoHour(duration.peak)
            offset = DurationsIntoHour(duration.offset)


        }
        </script>
