
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Profile</title>
        <meta name="description" content="User profile page with medication intake summary and totals.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="profile.css">
    </head>
    <body>
        <div id="container">
            <div id="profile">
                <div id="header">
                    <h1 id="username">Hookey</h1>
                    <div id="profile-pic" class="profile-avatar">
                        <img src="https://i.pinimg.com/736x/86/b5/34/86b53487e37122210591af58182596fb.jpg" alt="Profile Picture">
                        <div class="avatar-overlay">
                            <span>Edit</span>
                        </div>
                    </div>
                </div>
                
                <div id="profile-data">
                <div id="dataa">
  
                    <h1 id="title">intake:</h1>
                    <div id="intake">

					{{range .RecentIntakes}}
                    <div id="item">
						<p id="textt">{{.Amount}}{{.Unit}} {{.DrugName}}</p><p id="textt">{{.TimeAgo}}</p><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-capsule-pill" viewBox="0 0 16 16">
                        <path d="M11.02 5.364a3 3 0 0 0-4.242-4.243L1.121 6.778a3 3 0 1 0 4.243 4.243l5.657-5.657Zm-6.413-.657 2.878-2.879a2 2 0 1 1 2.829 2.829L7.435 7.536zM12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8m-.5 1.042a3 3 0 0 0 0 5.917zm1 5.917a3 3 0 0 0 0-5.917z"></path>
                        </svg>
                    </div>
					{{end}}

                </div></div>

                <div id="dataa">
  
                    <h1 id="title">Totals:</h1>
                    <div id="intake">

                    <div id="item">
                        <p id="textt">Prega: x50.</p><p id="textt">total: 20300mg</p><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-capsule-pill" viewBox="0 0 16 16">
                        <path d="M11.02 5.364a3 3 0 0 0-4.242-4.243L1.121 6.778a3 3 0 1 0 4.243 4.243l5.657-5.657Zm-6.413-.657 2.878-2.879a2 2 0 1 1 2.829 2.829L7.435 7.536zM12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8m-.5 1.042a3 3 0 0 0 0 5.917zm1 5.917a3 3 0 0 0 0-5.917z"></path>
                        </svg>
                    </div>
 

                </div></div>
        
                </div>
                    <div class="bottombar">
                        
                        <a class="btn" href="/">Back</a>
                    </div>
            </div>
        </div>
    </body>
</html>
