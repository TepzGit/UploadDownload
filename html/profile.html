<script>
    const AP = document.getElementById("AP");
    const DT = document.getElementById("DT");
    const PR = document.getElementById("PR");

    const openAP = document.getElementById("APB");
    const openDT = document.getElementById("DTB");
    const openPR = document.getElementById("PRB");

    const closeBtnA = document.getElementById("CSA");
    const closeBtnD = document.getElementById("CSD");
    const closeBtnP = document.getElementById("CSP");

    const popupTransitionMs = 240;

    function showPopup(popup) {
        popup.style.display = "flex";
        requestAnimationFrame(() => {
            popup.classList.add("active");
        });
    }

    function hidePopup(popup) {
        popup.classList.remove("active");
        setTimeout(() => {
            popup.style.display = "none";
        }, popupTransitionMs);
    }

    openAP.onclick = (e) => {
        e.preventDefault();
        showPopup(AP);
    };

    openDT.onclick = (e) => {
        e.preventDefault();
        showPopup(DT);
    };

    openPR.onclick = (e) => {
        e.preventDefault();
        showPopup(PR);
    };

    closeBtnA.onclick = () => {
        hidePopup(AP);
    };

    closeBtnD.onclick = () => {
        hidePopup(DT);
    };

    closeBtnP.onclick = () => {
        hidePopup(PR);
    };
</script>
