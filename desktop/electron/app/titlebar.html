<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Geek⁴u</title>
<style>
  :root { --bg: #000; --line: #1d1a24; --text: #f5f3fa; --muted: #9c96aa; --accent: #a67cff; --h: 38px; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1 "Roboto Mono", ui-monospace, Consolas, monospace; overflow: hidden; user-select: none; }
  .bar { display: flex; align-items: center; height: var(--h); border-bottom: 1px solid var(--line); -webkit-app-region: drag; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; color: var(--text); }
  .brand svg { display: block; }
  .brand { width: auto; height: 100%; border-radius: 0; color: var(--text); border: 0; background: none; cursor: pointer; -webkit-app-region: no-drag; transition: filter 0.2s ease, transform 0.12s ease; }
  .brand:hover { filter: drop-shadow(0 2px 8px rgba(166, 124, 255, 0.6)); }
  .brand:active { transform: scale(0.96); }
  .brand svg.xn-logo { width: auto; height: 26px; fill: initial; stroke: none; }
  .brand.off { display: none; }
  .brand:focus-visible { outline: 2px solid #a67cff; outline-offset: -2px; }
  .nav { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .title { flex: 1; min-width: 0; padding: 0 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
  button { -webkit-app-region: no-drag; display: grid; place-items: center; width: 34px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: default; }
  button:hover:not(:disabled) { background: #17141d; color: var(--text); }
  button:disabled { opacity: .3; }
  button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .win { display: flex; height: 100%; -webkit-app-region: no-drag; }
  .win button { width: 46px; height: 100%; border-radius: 0; }
  .win .x:hover { background: #e5484d; color: #fff; }
  .spin { width: 10px; height: 10px; margin-right: 8px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; visibility: hidden; }
  .loading .spin { visibility: visible; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { position: fixed; inset: var(--h) 0 0; display: none; place-items: center; padding: 30px; text-align: center; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }
  .err.show { display: grid; }
</style>
</head>

  <div class="nav">
    <button id="back" title="Back (Alt+Left)" disabled><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>

<script>
  const $ = (id) => document.getElementById(id);
  ["back", "forward", "reload", "home", "min", "max", "close"].forEach((id) => $(id).addEventListener("click", () => geek4u.act(id)));
  $("brand").addEventListener("click", () => geek4u.act("home"));
  $("bar").addEventListener("dblclick", (e) => { if (!e.target.closest("button")) geek4u.act("max"); });
  const MAX = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
  const RESTORE = '<svg viewBox="0 0 24 24"><rect x="5" y="8" width="11" height="11" rx="1.5"/><path d="M8 8V6.5A1.5 1.5 0 0 1 9.5 5H17.5A1.5 1.5 0 0 1 19 6.5V14.5A1.5 1.5 0 0 1 17.5 16H16"/></svg>';
  geek4u.on((kind, v) => {
    if (kind === "title") $("title").textContent = v;
    else if (kind === "nav") { $("back").disabled = !v.back; $("forward").disabled = !v.forward; }
    else if (kind === "loading") document.body.classList.toggle("loading", v);
    else if (kind === "max") { $("max").innerHTML = v ? RESTORE : MAX; $("max").title = v ? "Restore" : "Maximize"; }
    else if (kind === "logo") $("brand").classList.toggle("off", !v);
    else if (kind === "error") { $("err").textContent = v; $("err").classList.add("show"); }
  });
</script>
